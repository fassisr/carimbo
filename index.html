<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3B2BF5">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/brand/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/brand/icon-192.png">
<title>Fuilá</title>
<meta name="description" content="Fuilá: colecione os lugares onde você foi. Faça check-in em cafés, bares e parques reais perto de você e ganhe carimbos, insígnias e cupons.">
<link rel="stylesheet" href="assets/vendor/maplibre-gl.css">
<style>
@font-face { font-family: "Bricolage Grotesque"; font-weight: 600; font-display: swap; src: url("assets/fonts/bricolage-grotesque-latin-600-normal.woff2") format("woff2"); }
@font-face { font-family: "Bricolage Grotesque"; font-weight: 800; font-display: swap; src: url("assets/fonts/bricolage-grotesque-latin-800-normal.woff2") format("woff2"); }
@font-face { font-family: "Figtree"; font-weight: 400; font-display: swap; src: url("assets/fonts/figtree-latin-400-normal.woff2") format("woff2"); }
@font-face { font-family: "Figtree"; font-weight: 500; font-display: swap; src: url("assets/fonts/figtree-latin-500-normal.woff2") format("woff2"); }
@font-face { font-family: "Figtree"; font-weight: 600; font-display: swap; src: url("assets/fonts/figtree-latin-600-normal.woff2") format("woff2"); }
@font-face { font-family: "Figtree"; font-weight: 700; font-display: swap; src: url("assets/fonts/figtree-latin-700-normal.woff2") format("woff2"); }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
html, body { margin: 0; }

/* ===== Sistema de design Fuilá =====
   Cores por função, escala curta de tipo (Bricolage para títulos e números, Figtree para texto),
   espaços em múltiplos de 4, três raios, sombra sólida embaixo ("apertável") e três tempos de movimento. */
:root {
  --paper: #FFFBEF; --paper-line: rgba(59, 43, 245, .08); --brand: #3B2BF5; --bg: #F6F5FF; --surface: #FFFFFF; --surface-2: #EFEDFC; --fg: #14112B; --muted: #5D5A78; --line: #DEDBF3;
  --ink: #3B2BF5; --ink-fg: #FFFFFF; --gold: #FFC21A; --gold-fg: #241A00; --ok: #1E8A4C;
  --edge: #D4CFF6; --ink-edge: #2112C4; --gold-edge: #D99B00; --scrim: rgba(20, 17, 43, .45);
  --sky: #9C92FF; --ground: #E6E3FF;
  --me: #3B2BF5; --on-pin: #FFFFFF; --shadow: rgba(20, 17, 43, .20);
  --c-cafe: #A0471D; --c-bar: #6A35B0; --c-doce: #D03A78; --c-verde: #23874A; --c-cultura: #1E62C4; --c-comida: #0E7F84;
  --f-display: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --f-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --t-xs: 12px; --t-sm: 13px; --t-md: 15px; --t-lg: 18px; --t-xl: 24px; --t-2xl: 30px;
  --r-sm: 12px; --r-md: 18px; --r-lg: 28px;
  --float: 0 10px 24px rgba(20, 17, 43, .18);
  --d-fast: .14s; --d-mid: .28s; --d-party: .6s;
  --ease: cubic-bezier(.2, .8, .2, 1); --bounce: cubic-bezier(.3, 1.5, .5, 1);
  --safe-l: max(16px, env(safe-area-inset-left, 0px)); --safe-r: max(16px, env(safe-area-inset-right, 0px));
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #221D3E; --paper-line: rgba(255, 255, 255, .06); --brand: #3B2BF5; --bg: #0D0B1C; --surface: #1B1733; --surface-2: #252046; --fg: #EDEBFF; --muted: #A29EC4; --line: #332E5C;
  --ink: #8C80FF; --ink-fg: #0D0B1C; --gold: #FFC93D; --gold-fg: #241A00; --ok: #4CC782;
  --edge: #07060F; --ink-edge: #5B4FE0; --gold-edge: #B37D00; --scrim: rgba(5, 4, 15, .6);
  --sky: #0C0930; --ground: #1A1452; --me: #8C80FF; --shadow: rgba(0, 0, 0, .5);
  --c-cafe: #D06A39; --c-bar: #9566DB; --c-doce: #EC5E96; --c-verde: #3DAE69; --c-cultura: #4C8BEA; --c-comida: #2DB3B8;
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --paper: #221D3E; --paper-line: rgba(255, 255, 255, .06); --brand: #3B2BF5; --bg: #0D0B1C; --surface: #1B1733; --surface-2: #252046; --fg: #EDEBFF; --muted: #A29EC4; --line: #332E5C;
  --ink: #8C80FF; --ink-fg: #0D0B1C; --gold: #FFC93D; --gold-fg: #241A00; --ok: #4CC782;
  --edge: #07060F; --ink-edge: #5B4FE0; --gold-edge: #B37D00; --scrim: rgba(5, 4, 15, .6);
  --sky: #0C0930; --ground: #1A1452; --me: #8C80FF; --shadow: rgba(0, 0, 0, .5);
  --c-cafe: #D06A39; --c-bar: #9566DB; --c-doce: #EC5E96; --c-verde: #3DAE69; --c-cultura: #4C8BEA; --c-comida: #2DB3B8;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: var(--t-md); overflow: hidden; -webkit-tap-highlight-color: transparent; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, a:focus-visible, [tabindex]:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.num { font-family: var(--f-display); font-variant-numeric: tabular-nums; }

/* ícones bicolores: contorno grosso + preenchimento suave */
.ic { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.ic .du { fill: currentColor; stroke: none; opacity: .28; }

/* superfícies apertáveis: sombra sólida embaixo que some ao tocar */
.press { --e: var(--edge); box-shadow: 0 4px 0 var(--e); transition: transform var(--d-fast) var(--ease), box-shadow var(--d-fast) var(--ease); }
.press:active:not([disabled]) { transform: translateY(3px); box-shadow: 0 1px 0 var(--e); }

#app { position: relative; height: 100%; max-width: 520px; margin: 0 auto; background: var(--bg); overflow: hidden; }
@media (min-width: 560px) { #app { border-left: 1px solid var(--line); border-right: 1px solid var(--line); } }
main { position: absolute; inset: 0; isolation: isolate; z-index: 0; }
.view { position: absolute; inset: 0; }

/* ===== mapa ===== */
#map { width: 100%; height: 100%; display: block; touch-action: none; user-select: none; -webkit-user-select: none; background: var(--ground); }
.sky { position: absolute; left: 0; right: 0; top: 0; height: 26%; pointer-events: none; z-index: 1;
  background: linear-gradient(to bottom, var(--sky) 0%, var(--sky) 18%, color-mix(in srgb, var(--sky) 55%, transparent) 55%, transparent 100%); }
.maplibregl-map { font-family: var(--f-body); }
.maplibregl-ctrl-attrib { font-size: 10px; }
.maplibregl-ctrl-bottom-right { bottom: calc(env(safe-area-inset-bottom, 0px) + 96px); }
.maplibregl-marker { cursor: pointer; }
.nomap { display: grid; place-items: center; height: 100%; padding: 40px 24px; text-align: center; color: var(--muted); }

/* avatar 2D (só quando o 3D não carrega) */
.avatar { width: 46px; height: 62px; pointer-events: none; }
.avatar svg { overflow: visible; display: block; filter: drop-shadow(0 2px 2px rgba(20, 17, 43, .25)); }
.av-shadow { fill: rgba(20, 17, 43, .28); }
.av-flip { transition: transform .2s; }
.avatar.left .av-flip { transform: scaleX(-1); }
.av-body { fill: #3B2BF5; stroke: #fff; stroke-width: 1.5; }
.av-pack { fill: #FFC21A; stroke: #fff; stroke-width: 1.5; }
.av-head { fill: #F3C29C; stroke: #fff; stroke-width: 1.5; }
.av-cap { fill: #FFC21A; }
.av-eye { fill: #14112B; }
.av-leg path, .av-arm path { fill: none; stroke: #14112B; stroke-width: 4.5; stroke-linecap: round; }
.av-leg .av-shoe { stroke: #14112B; stroke-width: 4; }
.av-leg-b path, .av-arm-b path { stroke: #3A3560; }
.av-arm path { stroke: #3B2BF5; stroke-width: 4; }
.av-arm-b path { stroke: #2A1FC2; }
.av-leg, .av-arm { transform-box: fill-box; transform-origin: 50% 0; }
.avatar .av-bob { animation: breathe 2.4s ease-in-out infinite; }
.avatar.walking .av-bob { animation: bob .5s ease-in-out infinite; }
.avatar.walking .av-leg-f, .avatar.walking .av-arm-b { animation: swing .5s ease-in-out infinite alternate; }
.avatar.walking .av-leg-b, .avatar.walking .av-arm-f { animation: swing .5s ease-in-out infinite alternate-reverse; }
@keyframes swing { from { transform: rotate(28deg); } to { transform: rotate(-28deg); } }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-2.5px); } }
@keyframes breathe { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-1px); } }

/* paradas (estilo Pokéstop): moeda flutuando sobre um poste, com anel no chão */
.pinbtn { background: none; border: 0; padding: 0; }
.stop { position: relative; width: 56px; height: 80px; --cc: var(--c-cafe); }
.stop-ring { position: absolute; bottom: 0; left: 50%; width: 46px; height: 17px; margin-left: -23px; border-radius: 50%;
  border: 2.5px solid #fff; background: color-mix(in srgb, var(--cc) 30%, transparent); box-shadow: 0 1px 3px rgba(0,0,0,.25); }
.stop-post { position: absolute; bottom: 8px; left: 50%; width: 5px; height: 34px; margin-left: -2.5px; border-radius: 3px;
  background: linear-gradient(to bottom, color-mix(in srgb, var(--cc) 75%, #000), var(--cc) 40%, color-mix(in srgb, var(--cc) 45%, #fff)); }
.stop-float { position: absolute; bottom: 34px; left: 50%; width: 40px; height: 40px; margin-left: -20px; perspective: 160px; animation: stopbob 2.6s ease-in-out infinite; }
.stop-coin { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; color: #fff; overflow: hidden;
  background: radial-gradient(circle at 34% 28%, color-mix(in srgb, var(--cc) 45%, #fff), var(--cc) 62%, color-mix(in srgb, var(--cc) 80%, #000));
  border: 3px solid #fff; box-shadow: 0 4px 0 color-mix(in srgb, var(--cc) 55%, #000), 0 8px 12px rgba(0,0,0,.28);
  animation: coinswing 3.4s ease-in-out infinite alternate; }
.stop-coin .ic { width: 21px; height: 21px; stroke-width: 2.4; }
.stop-coin .ic .du { opacity: .35; }
.stop-coin img { width: 100%; height: 100%; object-fit: cover; background: #fff; }
.stop.logo .stop-coin { background: #fff; }
.stop.dest { --cc: var(--gold); }
.stop.dest .stop-coin { color: var(--gold-fg); width: 46px; height: 46px; margin: -3px; }
.stop.dest .stop-coin .ic { width: 23px; height: 23px; }
.stop-badge { position: absolute; right: -6px; top: -6px; width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center;
  background: var(--brand); color: #fff; border: 2px solid #fff; box-shadow: 0 2px 4px rgba(0,0,0,.25); }
.stop-badge .ic { width: 11px; height: 11px; stroke-width: 3.2; }
.stop-badge.star { background: var(--gold); color: var(--gold-fg); }
.stop-badge.star .ic { fill: currentColor; stroke-width: 1.5; }
.stop.visited { --cc: var(--brand); }
.stop.visited .stop-coin { animation: none; }
.stop.inrange:not(.visited) .stop-coin { animation: coinspin 1.8s linear infinite; }
.stop.inrange:not(.visited) .stop-ring { animation: ringpulse 1.4s ease-out infinite; border-color: var(--gold); }
.far .stop { transform: scale(.68); transform-origin: 50% 100%; }
.far .stop-label { display: none; }
.stop-label { position: absolute; top: calc(100% + 2px); left: 50%; transform: translateX(-50%); width: max-content; max-width: 130px;
  font: 800 11px/1.15 var(--f-display); color: #fff; text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  text-shadow: 0 0 3px rgba(20,17,43,.9), 0 1px 2px rgba(20,17,43,.9); pointer-events: none; }
@keyframes stopbob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
@keyframes coinswing { from { transform: rotateY(-32deg); } to { transform: rotateY(32deg); } }
@keyframes coinspin { to { transform: rotateY(360deg); } }
@keyframes ringpulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--gold) 80%, transparent); } 100% { box-shadow: 0 0 0 14px transparent; } }

/* ===== HUD flutuante ===== */
.hud { position: absolute; top: 12px; left: var(--safe-l); right: var(--safe-r); z-index: 500; display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; pointer-events: none; }
.hud > * { pointer-events: auto; }
.hud-me { display: flex; align-items: center; border: 0; background: none; padding: 0; min-width: 0; text-align: left; }
.portrait { position: relative; width: 60px; height: 60px; flex: none; border-radius: 50%; padding: 4px; z-index: 1;
  background: conic-gradient(var(--gold) calc(var(--p, 0) * 1%), color-mix(in srgb, var(--surface) 70%, var(--line)) 0); box-shadow: 0 4px 0 var(--ink-edge), var(--float); }
.portrait i { display: block; width: 100%; height: 100%; border-radius: 50%; overflow: hidden; background: radial-gradient(circle at 50% 30%, #8C80FF, var(--brand)); border: 3px solid var(--surface); }
.portrait img { width: 100%; height: 100%; display: block; }
.lvl { position: absolute; right: -4px; bottom: -4px; min-width: 26px; height: 26px; padding: 0 6px; border-radius: 13px; display: grid; place-items: center;
  background: var(--gold); color: var(--gold-fg); border: 3px solid var(--surface); font: 800 13px var(--f-display); }
.hud-pill { margin-left: -14px; padding: 6px 14px 7px 22px; background: var(--surface); border-radius: 0 var(--r-md) var(--r-md) 0; box-shadow: 0 4px 0 var(--edge), var(--float); min-width: 0; max-width: 58vw; }
.hud-pill b { display: flex; gap: 6px; align-items: baseline; font: 800 var(--t-md)/1.15 var(--f-display); white-space: nowrap; }
.hud-pill b small { font: 700 var(--t-xs) var(--f-display); color: var(--ink); font-variant-numeric: tabular-nums; }
.hud-pill span { display: block; font-size: var(--t-xs); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hud-side { display: grid; gap: 12px; }

/* botões redondos do mapa */
.rbtn { position: relative; width: 52px; height: 52px; border-radius: 50%; border: 0; background: var(--surface); color: var(--fg); display: grid; place-items: center; --e: var(--edge); box-shadow: 0 4px 0 var(--e), var(--float); }
.rbtn .ic { width: 24px; height: 24px; }
.rbtn.on { background: var(--gold); color: var(--gold-fg); --e: var(--gold-edge); }
.rbtn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--e), var(--float); }
.count { position: absolute; top: -4px; right: -4px; min-width: 22px; height: 22px; padding: 0 6px; border-radius: 11px; display: grid; place-items: center;
  background: var(--brand); color: #fff; border: 2.5px solid var(--surface); font: 800 11px var(--f-display); }
.count.gold { background: var(--gold); color: var(--gold-fg); }
.count.hot { background: var(--c-doce); color: #fff; }

/* barra de baixo: radar, botão central, centralizar */
.dock { position: absolute; left: var(--safe-l); right: var(--safe-r); bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); z-index: 650; display: flex; justify-content: space-between; align-items: center; pointer-events: none; }
.dock > * { pointer-events: auto; }
.orb { position: relative; width: 76px; height: 76px; border-radius: 50%; border: 4px solid #fff; padding: 0; display: grid; place-items: center;
  background: radial-gradient(circle at 35% 30%, #6A5CFF, var(--brand) 60%, #2A1CD0); --e: var(--ink-edge); box-shadow: 0 5px 0 var(--e), 0 12px 26px rgba(59, 43, 245, .45);
  transition: transform var(--d-fast) var(--ease), box-shadow var(--d-fast) var(--ease); }
.orb:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--e), 0 6px 14px rgba(59, 43, 245, .4); }
.orb > svg { width: 34px; height: 40px; transition: transform var(--d-mid) var(--bounce); }
.orb .x { position: absolute; inset: 0; display: grid; place-items: center; color: #fff; opacity: 0; transform: rotate(-90deg) scale(.5); transition: all var(--d-mid) var(--bounce); }
.orb .x .ic { width: 30px; height: 30px; stroke-width: 3; }
.orb.open > svg { transform: scale(0); }
.orb.open .x { opacity: 1; transform: none; }
.orb .count { top: -2px; right: -2px; }

/* menu do botão central */
.menu { position: absolute; inset: 0; z-index: 640; background: linear-gradient(to top, var(--scrim), color-mix(in srgb, var(--scrim) 40%, transparent) 55%, transparent);
  animation: fade var(--d-mid) var(--ease); }
.menu-row { position: absolute; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom, 0px) + 112px); display: flex; justify-content: center; align-items: flex-end; gap: 12px; }
.mtile { display: grid; justify-items: center; gap: 8px; border: 0; background: none; padding: 0; color: #fff; font: 800 var(--t-sm) var(--f-display); animation: rise var(--d-mid) var(--bounce) both; }
.mtile:nth-child(2), .mtile:nth-child(3) { margin-bottom: 26px; } .mtile:nth-child(2) { animation-delay: 40ms; } .mtile:nth-child(3) { animation-delay: 80ms; } .mtile:nth-child(4) { animation-delay: 120ms; }
.mtile i { position: relative; width: 66px; height: 66px; border-radius: 50%; display: grid; place-items: center; border: 4px solid #fff; color: #fff;
  background: radial-gradient(circle at 35% 30%, color-mix(in srgb, var(--cc) 55%, #fff), var(--cc) 65%); box-shadow: 0 5px 0 color-mix(in srgb, var(--cc) 55%, #000), var(--float); }
.mtile i .ic { width: 32px; height: 32px; }
.mtile i .ic .du { opacity: .4; }
.mtile:active i { transform: translateY(3px); box-shadow: 0 2px 0 color-mix(in srgb, var(--cc) 55%, #000); }
.mtile span { background: rgba(20, 17, 43, .72); padding: 3px 10px; border-radius: 999px; }
@keyframes rise { from { transform: translateY(40px) scale(.6); opacity: 0; } }
@keyframes fade { from { opacity: 0; } }

/* status e avisos */
/* navegação "Ir até lá": cartão da próxima instrução no topo */
.nav { position: absolute; top: 12px; left: var(--safe-l); right: var(--safe-r); z-index: 530; display: grid; grid-template-columns: 64px 1fr; gap: 0 12px; align-items: center;
  background: var(--ink); color: var(--ink-fg); border-radius: var(--r-lg); padding: 12px 12px 10px; box-shadow: 0 5px 0 var(--ink-edge), var(--float); animation: toastin var(--d-mid) var(--bounce); }
.nav-arrow { grid-row: span 2; width: 64px; height: 64px; border-radius: 18px; background: rgba(255,255,255,.14); display: grid; place-items: center; }
.nav-arrow svg { width: 44px; height: 44px; }
.nav .spin { width: 26px; height: 26px; border-radius: 50%; border: 4px solid #fff; border-right-color: transparent; animation: spin .8s linear infinite; }
.nav-dist { font: 800 28px/1 var(--f-display); font-variant-numeric: tabular-nums; }
.nav-txt { font-weight: 700; font-size: var(--t-sm); line-height: 1.25; opacity: .92; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.nav-foot { grid-column: 1 / -1; display: flex; align-items: center; gap: 8px; margin-top: 10px; padding-top: 10px; border-top: 1px solid rgba(255,255,255,.18); font-size: var(--t-sm); font-weight: 700; }
.nav-foot .to { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nav-foot .to b { font-family: var(--f-display); font-variant-numeric: tabular-nums; }
.nav-foot button { border: 0; border-radius: 999px; min-height: 40px; padding: 0 14px; font-weight: 800; font-size: var(--t-sm); background: rgba(255,255,255,.16); color: inherit; }
.nav-foot button.end { background: var(--gold); color: var(--gold-fg); }
.nav.off { background: #C8232C; box-shadow: 0 5px 0 #8E141B, var(--float); }
.navigating .hud-me, .navigating #status, .navigating #near { display: none; }
.navigating .hud { top: 176px; justify-content: flex-end; }
.sh-go { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
.sh-go .gbtn { justify-content: center; margin: 0; }
.status { position: absolute; top: 88px; left: 50%; transform: translateX(-50%); width: max-content; max-width: calc(100% - 32px); z-index: 520;
  display: flex; align-items: center; gap: 10px; background: var(--surface); color: var(--fg); font-size: var(--t-sm); font-weight: 600; padding: 8px 8px 8px 14px; border-radius: var(--r-md); box-shadow: 0 4px 0 var(--edge), var(--float); }
.status span { flex: 1; min-width: 0; line-height: 1.35; }
.status button { flex: none; border: 0; border-radius: var(--r-sm); background: var(--gold); color: var(--gold-fg); font-weight: 800; font-size: var(--t-xs); padding: 7px 11px; box-shadow: 0 3px 0 var(--gold-edge); }
.status .spin { width: 16px; height: 16px; border-radius: 50%; border: 2.5px solid var(--ink); border-right-color: transparent; animation: spin .8s linear infinite; flex: none; }
.status:not(:has(button)) { padding-right: 14px; }
@keyframes spin { to { transform: rotate(360deg); } }
#toast { position: absolute; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 110px); transform: translateX(-50%); width: max-content; max-width: calc(100% - 32px);
  background: var(--fg); color: var(--bg); padding: 11px 16px; border-radius: var(--r-md); font-size: var(--t-sm); font-weight: 700; z-index: 900; box-shadow: var(--float); animation: toastin var(--d-mid) var(--bounce); }
@keyframes toastin { from { transform: translate(-50%, 16px); opacity: 0; } }

/* radar: lugares por perto */
.near { position: absolute; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom, 0px) + 104px); z-index: 600; animation: rise var(--d-mid) var(--ease); }
.near-h { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 0 var(--safe-r) 0 var(--safe-l); margin-bottom: 8px; }
.near-h b, .near-h span { background: var(--surface); border-radius: 999px; box-shadow: 0 3px 0 var(--edge); }
.near-h b { font: 800 var(--t-md) var(--f-display); padding: 5px 12px; }
.near-h span { font-size: var(--t-xs); font-weight: 700; color: var(--muted); padding: 5px 10px; }
.near-track { display: flex; gap: 10px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; padding: 2px var(--safe-r) 8px var(--safe-l); }
.near-track::-webkit-scrollbar { display: none; }
.near-card { scroll-snap-align: start; flex: none; width: 220px; display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; align-items: center; text-align: left;
  background: var(--surface); border: 0; border-radius: var(--r-md); padding: 10px 12px; box-shadow: 0 4px 0 var(--edge), var(--float); }
.near-card:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--edge); }
.nc-ic { grid-row: span 2; width: 42px; height: 42px; border-radius: 50%; background: var(--cc); color: var(--on-pin); display: grid; place-items: center; box-shadow: 0 3px 0 color-mix(in srgb, var(--cc) 60%, #000); }
.nc-ic .ic .du { opacity: .35; }
.nc-name { font-weight: 800; font-size: var(--t-md); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.nc-meta { font-size: var(--t-xs); color: var(--muted); display: flex; gap: 6px; align-items: center; font-variant-numeric: tabular-nums; flex-wrap: wrap; }
.near-empty { margin: 0 var(--safe-r) 0 var(--safe-l); background: var(--surface); border-radius: var(--r-md); padding: 12px 14px; font-size: var(--t-sm); color: var(--muted); box-shadow: 0 4px 0 var(--edge), var(--float); }
.near-empty b { color: var(--fg); }
.tag { font-size: 11px; font-weight: 800; padding: 2px 8px; border-radius: 999px; }
.tag.in { background: var(--gold); color: var(--gold-fg); }
.tag.dest { background: color-mix(in srgb, var(--gold) 26%, transparent); color: var(--fg); }
.tag.done { background: color-mix(in srgb, var(--ok) 16%, transparent); color: var(--ok); }

/* ===== folhas que sobem de baixo ===== */
.sheet { position: absolute; left: 0; right: 0; bottom: 0; max-height: 80%; overflow-y: auto; background: var(--surface); border-radius: var(--r-lg) var(--r-lg) 0 0; z-index: 700;
  box-shadow: 0 -12px 34px var(--shadow); padding: 10px var(--safe-r) calc(env(safe-area-inset-bottom, 0px) + 22px) var(--safe-l);
  animation: up var(--d-mid) var(--ease); }
@keyframes up { from { transform: translateY(40%); opacity: 0; } to { transform: none; opacity: 1; } }
.sh-grab { width: 44px; height: 5px; border-radius: 5px; background: var(--line); margin: 0 auto 12px; }
.sh-close { position: absolute; top: 12px; right: var(--safe-r); width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--surface-2); color: var(--muted); display: grid; place-items: center; }
.sh-close .ic { width: 18px; height: 18px; stroke-width: 2.8; }
.sheet h2 { font: 800 var(--t-xl)/1.1 var(--f-display); letter-spacing: -.01em; margin: 10px 0 4px; text-wrap: balance; padding-right: 44px; }
.chiprow { display: flex; flex-wrap: wrap; gap: 6px; padding-right: 44px; }
.cat-chip, .dest-chip { display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px 4px 7px; border-radius: 999px; font-size: var(--t-xs); font-weight: 800; }
.cat-chip { background: color-mix(in srgb, var(--cc) 14%, transparent); color: var(--cc); }
.dest-chip { background: var(--gold); color: var(--gold-fg); }
.cat-chip .ic, .dest-chip .ic { width: 16px; height: 16px; }
.dest-chip .ic { fill: currentColor; stroke-width: 1.5; }
.rating { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: var(--t-sm); color: var(--muted); font-variant-numeric: tabular-nums; }
.desc { font-size: var(--t-md); line-height: 1.5; margin-top: 10px; }
.addr { font-size: var(--t-sm); color: var(--muted); margin-top: 6px; line-height: 1.4; }
.gbtn { display: inline-flex; align-items: center; gap: 6px; margin-top: 10px; padding: 7px 14px 7px 11px; min-height: 42px; border-radius: 999px; background: var(--surface-2); color: var(--fg); font-weight: 700; font-size: var(--t-sm); text-decoration: none; }
.gbtn .ic { width: 16px; height: 16px; color: var(--ink); }
.offer { display: flex; align-items: center; gap: 12px; border-radius: var(--r-md); padding: 12px 14px; margin: 14px 0 12px; background: color-mix(in srgb, var(--gold) 15%, var(--surface)); }
.offer > .ic { width: 40px; height: 40px; padding: 8px; border-radius: 50%; background: var(--gold); color: var(--gold-fg); box-shadow: 0 3px 0 var(--gold-edge); }
.offer small { display: block; font-size: var(--t-xs); font-weight: 700; color: var(--muted); }
.offer b { font-size: var(--t-md); line-height: 1.3; }
.offer.used { background: var(--surface-2); opacity: .8; }
.offer.used > .ic { background: var(--line); color: var(--muted); box-shadow: none; }
.prog { display: grid; gap: 6px; margin: 14px 0 16px; font-size: var(--t-sm); }
.prog-row { display: flex; justify-content: space-between; gap: 8px; }
.prog-row b { font-family: var(--f-display); }
.prog-row span { color: var(--muted); font-variant-numeric: tabular-nums; }
.bar { height: 12px; border-radius: 12px; background: var(--surface-2); overflow: hidden; box-shadow: inset 0 2px 0 rgba(20, 17, 43, .08); }
.bar i { display: block; height: 100%; min-width: 12px; background: var(--cc, var(--gold)); border-radius: 12px; transition: width .5s var(--ease); box-shadow: inset 0 -3px 0 rgba(0, 0, 0, .15), inset 0 3px 0 rgba(255, 255, 255, .3); }
.bar i[style*="width:0%"] { min-width: 0; }
.cta { width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px; border: 0; border-radius: var(--r-md); padding: 16px; font: 800 17px var(--f-display); letter-spacing: .01em;
  background: var(--ink); color: var(--ink-fg); --e: var(--ink-edge); box-shadow: 0 5px 0 var(--e); transition: transform var(--d-fast) var(--ease), box-shadow var(--d-fast) var(--ease); }
.cta:active:not([disabled]) { transform: translateY(4px); box-shadow: 0 1px 0 var(--e); }
.cta.gold { background: var(--gold); color: var(--gold-fg); --e: var(--gold-edge); }
.cta.soft { background: var(--surface-2); color: var(--fg); --e: var(--edge); }
.cta[disabled] { background: var(--surface-2); color: var(--muted); box-shadow: none; cursor: default; font-size: var(--t-md); }
.linkbtn.inline { display: inline; margin: 0; padding: 0; font-size: inherit; }
.linkbtn { display: block; margin: 12px auto 0; background: none; border: 0; color: var(--ink); font-weight: 700; font-size: var(--t-sm); text-decoration: underline; text-underline-offset: 3px; }
/* ficha do lugar: cabeçalho com foto ou com a cor e o ícone da categoria */
.sheet.hero { padding-top: 0; }
.sh-hero { position: relative; height: 150px; margin: 0 calc(-1 * var(--safe-r)) 0 calc(-1 * var(--safe-l)); overflow: hidden; color: #fff;
  background: radial-gradient(circle at 85% 15%, color-mix(in srgb, var(--cc) 50%, #fff), var(--cc) 55%, color-mix(in srgb, var(--cc) 70%, #000)); }
.sh-hero::before { content: ""; position: absolute; inset: 0; background-image: radial-gradient(rgba(255, 255, 255, .16) 2px, transparent 2.6px); background-size: 20px 20px; }
.sh-hero.photo::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to top, rgba(20, 17, 43, .55), transparent 55%); }
.sh-hero.photo { height: 190px; background: var(--surface-2); }
.sh-hero.photo::before { display: none; }
.sh-hero img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.hero-coin { position: absolute; right: 20px; bottom: 14px; width: 72px; height: 72px; border-radius: 50%; display: grid; place-items: center; z-index: 1; border: 5px solid #fff;
  background: radial-gradient(circle at 34% 28%, color-mix(in srgb, var(--cc) 45%, #fff), var(--cc) 62%, color-mix(in srgb, var(--cc) 80%, #000)); box-shadow: 0 6px 0 color-mix(in srgb, var(--cc) 50%, #000), 0 14px 24px rgba(0, 0, 0, .3);
  transform: rotate(-8deg); animation: coinin var(--d-party) var(--bounce) both; }
.hero-coin .ic { width: 36px; height: 36px; stroke-width: 2.4; }
.hero-coin .ic .du { opacity: .35; }
.hero-coin img { position: static; border-radius: 50%; }
@keyframes coinin { from { transform: rotate(-40deg) scale(.4); opacity: 0; } }
.sh-hero .sh-grab { position: absolute; top: 8px; left: 50%; margin: 0 0 0 -22px; background: rgba(255, 255, 255, .7); z-index: 2; }
.sheet.hero .sh-close { top: 14px; z-index: 3; background: rgba(255, 255, 255, .92); color: #14112B; box-shadow: 0 3px 0 rgba(0, 0, 0, .15); }
.hero-chips { position: absolute; left: var(--safe-l); bottom: 12px; z-index: 2; display: flex; flex-wrap: wrap; gap: 6px; padding-right: 120px; }
.hero-chips .cat-chip { background: rgba(255, 255, 255, .95); }
.sh-hero.photo .hero-coin, .sh-hero:not(.photo) .hero-credit { display: none; }
.hero-credit { position: absolute; left: 14px; top: 12px; text-shadow: 0 1px 3px rgba(0, 0, 0, .6); z-index: 2; font-size: 10px; color: rgba(255, 255, 255, .85); text-decoration: none; }
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; font-size: var(--t-sm); color: var(--muted); margin-top: 2px; }
.meta .dist { display: inline-flex; align-items: center; gap: 4px; font: 800 var(--t-sm) var(--f-display); color: var(--fg); background: var(--surface-2); padding: 4px 10px 4px 7px; border-radius: 999px; }
.meta .dist.in { background: var(--gold); color: var(--gold-fg); }
.meta .ic { width: 16px; height: 16px; }
.links { display: flex; flex-wrap: wrap; gap: 8px; }
/* o que você ganha ao carimbar */
.gains { display: grid; grid-template-columns: 1fr 1fr 1.4fr; gap: 8px; margin: 16px 0; }
.gain { background: var(--surface-2); border-radius: var(--r-md); padding: 10px; display: grid; gap: 4px; align-content: start; min-width: 0; }
.gain small { font-size: 11px; font-weight: 700; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.gain b { display: flex; align-items: center; gap: 5px; font: 800 var(--t-md) var(--f-display); white-space: nowrap; }
.gain b .ic { width: 18px; height: 18px; color: var(--ink); }
.gain.xp b .ic { color: var(--gold-edge); }
.gain .bar { height: 8px; margin-top: 2px; }
.gain.ok b .ic { color: var(--ok); }
/* oferta de parceiro com cara de ingresso */
.tk { position: relative; display: flex; align-items: stretch; margin: 14px 0; border-radius: var(--r-md); overflow: hidden; box-shadow: 0 4px 0 var(--gold-edge); }
.tk-l { width: 70px; flex: none; display: grid; place-items: center; background: var(--gold); color: var(--gold-fg); }
.tk-l .ic { width: 30px; height: 30px; }
.tk-r { flex: 1; background: color-mix(in srgb, var(--gold) 22%, var(--surface)); padding: 12px 14px; border-left: 3px dashed color-mix(in srgb, var(--gold-edge) 60%, transparent); }
.tk-r small { display: block; font-size: var(--t-xs); font-weight: 700; color: var(--muted); }
.tk-r b { font: 800 var(--t-lg)/1.2 var(--f-display); }
.tk::before, .tk::after { content: ""; position: absolute; left: 61px; width: 18px; height: 18px; border-radius: 50%; background: var(--surface); }
.tk::before { top: -9px; } .tk::after { bottom: -9px; }
.tk.used { filter: grayscale(.9); opacity: .7; }
.done-row { display: flex; align-items: center; gap: 14px; background: var(--surface-2); border-radius: var(--r-md); padding: 10px 14px; }
.done-row svg.stamp { width: 64px; height: 64px; flex: none; }
.done-row b { display: block; font-family: var(--f-display); }
.done-row span { font-size: var(--t-sm); color: var(--muted); }

/* folha de filtros */
.fgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 16px 0 14px; }
.ftile { display: flex; align-items: center; gap: 10px; text-align: left; border: 2px solid var(--line); background: var(--surface); border-radius: var(--r-md); padding: 10px; font-weight: 800; font-size: var(--t-sm); line-height: 1.2; min-height: 60px;
  box-shadow: 0 4px 0 var(--edge); transition: transform var(--d-fast) var(--ease), box-shadow var(--d-fast) var(--ease); }
.ftile:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--edge); }
.ftile i { width: 38px; height: 38px; border-radius: 50%; flex: none; display: grid; place-items: center; background: color-mix(in srgb, var(--cc) 16%, transparent); color: var(--cc); }
.ftile[aria-pressed="true"] { border-color: var(--cc); background: color-mix(in srgb, var(--cc) 10%, var(--surface)); box-shadow: 0 4px 0 color-mix(in srgb, var(--cc) 60%, #000); }
.ftile[aria-pressed="true"] i { background: var(--cc); color: #fff; }
.ftile[aria-pressed="true"] i .du { opacity: .35; }
.sh-sub { color: var(--muted); font-size: var(--t-sm); margin: 0; }
.afield { display: grid; gap: 6px; margin-top: 14px; font-weight: 800; font-size: var(--t-sm); }
.afield small { font-weight: 600; color: var(--muted); }
.afield input { border: 2px solid var(--line); border-radius: var(--r-sm); padding: 12px; font: 600 16px var(--f-body, inherit); background: var(--surface-2); color: var(--fg); min-height: 48px; }
.afield input:focus { outline: none; border-color: var(--ink); }
.fgrid.tight { margin: 8px 0 0; }
.a-dup { display: flex; align-items: center; gap: 10px; width: 100%; margin-top: 8px; border: 2px dashed var(--gold); background: color-mix(in srgb, var(--gold) 12%, var(--surface)); color: var(--fg); border-radius: var(--r-sm); padding: 10px 12px; text-align: left; font-size: var(--t-sm); min-height: 48px; }
.a-dup .ic { width: 20px; height: 20px; color: var(--ink); flex: none; }
#asheet .cta { margin-top: 18px; }
#asheet .cta[disabled] { opacity: .5; }
.a-note { color: var(--muted); font-size: var(--t-xs); text-align: center; margin: 10px 0 0; }
.near-card.add { border: 2px dashed var(--ink); background: color-mix(in srgb, var(--ink) 6%, var(--surface)); }
.near-card.add .nc-ic { background: var(--ink); color: var(--ink-fg); }
.sug-chip { background: var(--surface-2); color: var(--fg); }
#ssheet { top: max(12px, env(safe-area-inset-top)); bottom: auto; max-height: calc(100% - 24px); border-radius: var(--r-lg); margin: 0 10px; animation: sdrop .22s ease-out; }
@keyframes sdrop { from { transform: translateY(-14px); opacity: 0; } }
.sbox { position: relative; margin-top: 4px; }
.sbox .ic { position: absolute; left: 14px; top: 50%; translate: 0 -50%; width: 22px; height: 22px; color: var(--muted); pointer-events: none; }
.sbox input { width: 100%; box-sizing: border-box; border: 2px solid var(--line); border-radius: 999px; padding: 12px 16px 12px 46px; font: 600 16px var(--f-body, inherit); background: var(--surface-2); color: var(--fg); min-height: 52px; }
.sbox input:focus { outline: none; border-color: var(--ink); }
.s-sec { margin: 14px 2px 4px; font-size: var(--t-xs); font-weight: 800; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
.s-row { display: grid; grid-template-columns: 40px 1fr auto; gap: 12px; align-items: center; width: 100%; border: 0; background: none; color: var(--fg); text-align: left; padding: 9px 4px; border-radius: var(--r-sm); min-height: 56px; }
.s-row:active { background: var(--surface-2); }
.s-row + .s-row { border-top: 1px solid var(--line); }
.s-row .s-ic { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: color-mix(in srgb, var(--cc) 16%, transparent); color: var(--cc); }
.s-row .s-ic .ic { width: 22px; height: 22px; }
.s-row b { display: block; font-size: var(--t-md, 16px); line-height: 1.2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.s-row small { display: block; color: var(--muted); font-size: var(--t-xs); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.s-row > span:nth-child(2) { min-width: 0; }
.s-row em { font-style: normal; font-weight: 800; font-size: var(--t-xs); color: var(--ink); font-variant-numeric: tabular-nums; }
.s-empty { color: var(--muted); font-size: var(--t-sm); text-align: center; padding: 18px 8px 8px; margin: 0; }
.s-empty .spin { vertical-align: middle; margin-right: 6px; }
.dest-pin { width: 40px; height: 46px; filter: drop-shadow(0 4px 4px rgba(20,10,80,.35)); animation: pinpop .45s cubic-bezier(.3,1.6,.5,1); transform-origin: bottom center; }
@keyframes pinpop { from { transform: scale(.2) translateY(-30px); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { #ssheet, .dest-pin { animation: none; } }

/* ===== telas (passaporte, coleções, cupons) ===== */
.near-card.skel { pointer-events: none; }
.near-card.skel .nc-ic { background: var(--surface-2); box-shadow: none; }
.sk { display: block; height: 12px; border-radius: 6px; margin: 4px 0; background: linear-gradient(90deg, var(--surface-2) 30%, var(--line) 50%, var(--surface-2) 70%) 0 0 / 300% 100%; animation: shimmer 1.2s linear infinite; width: 80%; }
.sk.short { width: 50%; }
@keyframes shimmer { to { background-position: -150% 0; } }
.list.leaving, .sheet.leaving { animation: down var(--d-fast) var(--ease) forwards; pointer-events: none; }
@keyframes down { to { transform: translateY(24%); opacity: 0; } }
.list { z-index: 800; background: var(--bg); overflow-y: auto; padding: 20px var(--safe-r) calc(env(safe-area-inset-bottom, 0px) + 32px) var(--safe-l); animation: up var(--d-mid) var(--ease); }
.vclose { position: absolute; top: 16px; right: var(--safe-r); z-index: 850; width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--surface); color: var(--fg); display: grid; place-items: center; box-shadow: 0 4px 0 var(--edge); }
.vclose .ic { stroke-width: 2.8; }
.vclose:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--edge); }
.list h1 { font: 800 var(--t-2xl)/1.1 var(--f-display); margin: 4px 56px 6px 0; letter-spacing: -.02em; }
.list .lede { color: var(--muted); margin: 0 0 18px; line-height: 1.45; max-width: 60ch; }
.list h3 { font: 800 var(--t-lg) var(--f-display); margin: 28px 0 12px; }
.stack { display: grid; gap: 14px; }
.card { background: var(--surface); border-radius: var(--r-md); padding: 14px; box-shadow: 0 4px 0 var(--edge); }
.col-top { display: flex; gap: 12px; align-items: center; }
.col-ic { width: 48px; height: 48px; border-radius: 14px; background: var(--cc); color: #fff; display: grid; place-items: center; flex: none; box-shadow: 0 3px 0 color-mix(in srgb, var(--cc) 60%, #000); }
.col-ic .ic { width: 26px; height: 26px; }
.col-ic .ic .du { opacity: .35; }
.col-top div { min-width: 0; flex: 1; }
.col-top b { font: 800 var(--t-lg) var(--f-display); display: block; }
.col-top span { font-size: var(--t-sm); color: var(--muted); }
.col-count { font: 800 var(--t-lg) var(--f-display); font-variant-numeric: tabular-nums; flex: none !important; color: var(--fg) !important; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.chip { border: 0; background: var(--surface-2); border-radius: 999px; padding: 6px 12px; min-height: 38px; color: var(--fg); font-size: var(--t-sm); font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
.chip.on { background: var(--cc); color: var(--on-pin); }
.chip .ic { width: 15px; height: 15px; }
.col-reward { display: flex; align-items: center; gap: 8px; margin-top: 12px; padding-top: 12px; border-top: 2px solid var(--surface-2); font-size: var(--t-sm); color: var(--muted); }
.col-reward .ic { width: 18px; height: 18px; }
.col-reward b { color: var(--fg); }

/* cupons */
.ticket { display: grid; grid-template-columns: 1fr auto; background: var(--surface); border-radius: var(--r-md); overflow: hidden; position: relative; box-shadow: 0 4px 0 var(--edge); }
.ticket::before, .ticket::after { content: ""; position: absolute; right: 106px; width: 20px; height: 20px; border-radius: 50%; background: var(--bg); transform: translateX(50%); }
.ticket::before { top: -10px; } .ticket::after { bottom: -10px; }
.t-main { padding: 14px; min-width: 0; border-left: 6px solid var(--cc); }
.t-main small { color: var(--cc); font-weight: 800; font-size: var(--t-xs); }
.t-main b { display: block; font: 800 var(--t-lg)/1.2 var(--f-display); margin: 3px 0 4px; }
.t-main span { font-size: var(--t-sm); color: var(--muted); }
.t-side { width: 106px; border-left: 2px dashed var(--line); display: grid; place-items: center; gap: 6px; padding: 10px 8px; text-align: center; }
.code { font: 800 var(--t-sm) var(--f-display); letter-spacing: .08em; font-variant-numeric: tabular-nums; }
.t-side button { border: 0; background: var(--ink); color: var(--ink-fg); border-radius: var(--r-sm); font-size: var(--t-xs); font-weight: 800; padding: 8px 10px; box-shadow: 0 3px 0 var(--ink-edge); }
.ticket.used { opacity: .55; }

.empty { text-align: center; padding: 30px 20px; background: var(--surface); border-radius: var(--r-lg); color: var(--muted); line-height: 1.5; box-shadow: 0 4px 0 var(--edge); }

.slot { aspect-ratio: 1; max-width: 100%; border-radius: 50%; border: 2.5px dashed var(--line); display: grid; place-items: center; color: var(--muted); font: 800 var(--t-md) var(--f-display); margin: 10%; }
/* apresentação (primeira vez) */
#intro { position: fixed; inset: 0; z-index: 1500; background: var(--bg); display: flex; flex-direction: column; padding: max(14px, env(safe-area-inset-top)) 0 max(18px, env(safe-area-inset-bottom)); animation: fade var(--d-mid) var(--ease); }

.in-slide { flex: 0 0 100%; scroll-snap-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 0 28px; }

.in-foot { padding: 0 20px; display: grid; gap: 14px; }

/* telas vazias ilustradas */
.empty .ilu { width: min(220px, 70%); height: auto; display: block; margin: -6px auto 6px; }
/* missões, sequência e baús */
.streak { display: inline-flex; align-items: center; gap: 1px; font: 800 var(--t-xs) var(--f-display); font-style: normal; color: #F2792B; }

.sc-top { display: flex; gap: 12px; align-items: center; }

.sc-next { display: flex; align-items: center; gap: 6px; margin-top: 12px; font-weight: 700; opacity: .95; }

.mis.ok em { color: var(--ok); }

@keyframes wobble { 0%, 60%, 100% { transform: none; } 66% { transform: rotate(-5deg); } 74% { transform: rotate(5deg); } 82% { transform: rotate(-3deg); } 90% { transform: rotate(2deg); } }
.co-item { width: 200px; height: 200px; margin: 0 auto 16px; border-radius: 36px; background: #fff; padding: 8px; box-shadow: 0 0 0 6px var(--gold), 0 10px 0 6px var(--gold-edge), 0 0 60px rgba(255, 194, 26, .5); animation: medal var(--d-party) var(--bounce) both; }

.co-item { position: relative; }
.co-sw { position: absolute; right: -10px; bottom: -10px; width: 56px; height: 56px; border-radius: 50%; border: 5px solid #fff; box-shadow: 0 4px 0 rgba(0, 0, 0, .2); }
.co-item .th { display: block; width: 100%; height: 100%; border-radius: 28px; background: var(--surface-2) center / cover no-repeat; }
.chest-open .in-later { color: rgba(255, 255, 255, .8); margin-top: 10px; display: block; width: 100%; min-height: 44px; }

.lk-mark { position: absolute; top: 6px; right: 6px; width: 26px; height: 26px; border-radius: 50%; background: var(--surface); box-shadow: 0 0 0 2px var(--line); display: grid; place-items: center; }

.rbtn#fabMis.on { background: var(--gold); color: var(--gold-fg); --e: var(--gold-edge); }
.ppc-share { position: absolute; top: 14px; right: 14px; z-index: 2; width: 44px; height: 44px; border-radius: 50%; border: 0; background: rgba(255, 255, 255, .16); color: #fff; display: grid; place-items: center; }
.ppc-share .ic { width: 22px; height: 22px; }
/* passaporte como livrinho */
.ppc { position: relative; overflow: hidden; color: #fff; border-radius: 10px var(--r-lg) var(--r-lg) 10px; padding: 18px 18px 16px 30px;
  background: radial-gradient(circle at 90% 0%, #5A4BFF, transparent 60%), linear-gradient(90deg, #1E1590 0 12px, #2B1FCF 12px 14px, var(--brand) 14px); box-shadow: 0 5px 0 var(--ink-edge); }

.ppc-me { display: flex; align-items: center; gap: 14px; margin: 16px 0 14px; position: relative; z-index: 1; }

.book { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; gap: 0; border-radius: var(--r-md); outline: none; }

.leaf { flex: 0 0 100%; scroll-snap-align: start; padding: 14px 16px 16px; position: relative; background: var(--paper);
  background-image: repeating-linear-gradient(0deg, transparent 0 23px, var(--paper-line) 23px 24px); border-radius: var(--r-md); box-shadow: inset 10px 0 14px -10px rgba(40, 20, 90, .25), 0 4px 0 var(--edge); }

/* álbum de insígnias */

.album { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }

.album .lk { position: absolute; right: -6px; bottom: -6px; width: 22px; height: 22px; border-radius: 50%; background: var(--surface); display: grid; place-items: center; box-shadow: 0 0 0 2px var(--line); z-index: 1; }

.badge-info { display: flex; gap: 14px; align-items: center; margin-top: 12px; background: var(--surface); border-radius: var(--r-md); padding: 14px; box-shadow: 0 4px 0 var(--edge); animation: rise var(--d-mid) var(--bounce); }

.badge-info em { font-style: normal; font-weight: 800; font-size: var(--t-xs); display: block; margin-top: 6px; }

.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 10px; }
.badge { text-align: center; background: var(--surface); border-radius: var(--r-md); padding: 12px 8px; box-shadow: 0 4px 0 var(--edge); }
.medal { width: 56px; height: 56px; margin: 0 auto 8px; border-radius: 50%; display: grid; place-items: center; color: var(--on-pin);
  background: radial-gradient(circle at 35% 30%, color-mix(in srgb, var(--cc) 70%, #fff), var(--cc)); box-shadow: 0 0 0 3px var(--surface), 0 0 0 6px var(--gold), 0 5px 0 4px var(--gold-edge); }
.medal .ic { width: 26px; height: 26px; }
.medal .ic .du { opacity: .35; }
.badge b { font-size: var(--t-sm); display: block; line-height: 1.2; margin-top: 4px; }
.badge span { font-size: 11px; color: var(--muted); display: block; margin-top: 3px; line-height: 1.3; }
.badge.locked .medal { background: var(--surface-2); color: var(--muted); box-shadow: 0 0 0 3px var(--line); }
.badge.locked b { color: var(--muted); }
.chars { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
.me-card { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; border: 0; background: var(--surface); border-radius: var(--r-md); padding: 10px 14px 10px 10px; box-shadow: 0 4px 0 var(--edge); }

/* tela de Visual */
.closet-stage { position: relative; height: 300px; margin: 0 calc(-1 * var(--safe-r)) 4px calc(-1 * var(--safe-l));
  background: radial-gradient(circle at 50% 40%, color-mix(in srgb, var(--ink) 18%, var(--bg)), var(--bg) 70%); }
.closet-stage::before { content: ""; position: absolute; left: 50%; bottom: 34px; width: 170px; height: 38px; margin-left: -85px; border-radius: 50%; background: color-mix(in srgb, var(--gold) 40%, transparent); box-shadow: 0 0 0 8px color-mix(in srgb, var(--gold) 16%, transparent); }

  const x = Math.cos(a.lat * r) * Math.sin(b.lat * r) - Math.sin(a.lat * r) * Math.cos(b.lat * r) * Math.cos((b.lng - a.lng) * r);
  return (Math.atan2(y, x) / r + 360) % 360;
}
// anima o avatar: direção, andar/correr e parar; forced = 'run' no modo demo
function stepAvatar(from, to, forced) {
  window.avatar3d?.setPos(to.lat, to.lng);
  if (!from || meters(from, to) < 1.5) return;
  const now = performance.now();
  const speed = lastStep ? meters(lastStep.p, to) / Math.max(0.2, (now - lastStep.t) / 1000) : 1;
  lastStep = { p: { ...to }, t: now };
  heading = bearing(from, to);
  if (Math.abs(to.lng - from.lng) > 1e-7) meEl.classList.toggle('left', to.lng < from.lng);
  meEl.classList.add('walking');
  window.avatar3d?.setHeading(heading);
  window.avatar3d?.setMotion(forced || (speed > 2.2 ? 'run' : 'walk'));
  clearTimeout(walkT); walkT = setTimeout(() => { meEl.classList.remove('walking'); window.avatar3d?.setMotion('idle'); lastStep = null; }, 1800);
}

const markers = new Map();
const MAX_PINS = 300;

function pinHTML(p, cls) {
  const coin = p.logo ? `<img src="${esc(p.logo)}" alt="" loading="lazy">` : ic(p.cat);
  const badge = cls.includes('visited') ? `<span class="stop-badge">${ic('check')}</span>` : p.dest ? `<span class="stop-badge star">${ic('star')}</span>` : '';
  return `<div class="stop-ring"></div><div class="stop-post"></div>
    <div class="stop-float"><div class="stop-coin">${coin}</div>${badge}</div>
    ${p.dest ? `<div class="stop-label">${esc(p.n)}</div>` : ''}`;
}
function pinClass(p) { return 'stop' + (p.dest ? ' dest' : '') + (p.logo ? ' logo' : '') + (st.visits[p.id] ? ' visited' : '') + (dist(p) <= reach() ? ' inrange' : ''); }
function syncMarkers() {
  if (!map) return;
  // só desenha as paradas mais próximas (os destaques cobrem o Brasil todo e a busca traz centenas por bairro)
  const keep = new Set([...places.values()].filter(p => shown(p) && (!me || dist(p) <= 5000))
    .sort((a, b) => (me ? dist(a) - dist(b) : 0)).slice(0, MAX_PINS).map(p => p.id));
  for (const p of places.values()) {
    let m = markers.get(p.id);
    if (!keep.has(p.id)) { if (m) { m.remove(); markers.delete(p.id); } continue; }
    const cls = pinClass(p);
    if (!m) {
      const el = document.createElement('button');
      el.type = 'button'; el.className = 'pinbtn'; el.setAttribute('aria-label', p.n);
      el.addEventListener('click', ev => { ev.stopPropagation(); openSheet(p.id); });
      if (p.dest) el.style.zIndex = 2;
      m = new maplibregl.Marker({ element: el, anchor: 'bottom' }).setLngLat([p.lng, p.lat]).addTo(map);
      m._cls = null; markers.set(p.id, m);
    }
    if (m._cls !== cls) { m.getElement().innerHTML = `<div class="${cls}" style="--cc:${p.dest && !st.visits[p.id] ? 'var(--gold)' : st.visits[p.id] ? 'var(--brand)' : `var(--c-${p.cat})`}">${pinHTML(p, cls)}</div>`; m._cls = cls; }
  }
}

function setMe(lat, lng, acc) {
  const first = !me, prev = me;
  me = { lat, lng, acc };
  stepAvatar(prev, me);
  if (first && !demo) $('#where').textContent = 'Você está aqui';
  if (meMarker) { meMarker.setLngLat([lng, lat]); if (first && !use3d) meMarker.addTo(map); }
  updateRange();
  if (first && map) map.jumpTo({ center: [lng, lat], zoom: 18 });
  if (first) handlePendingQR();
  else followCam();
  if (!lastFetch || (meters(lastFetch, me) > RADIUS_FETCH * 0.6 && Date.now() - lastTry > 60000)) loadPlaces();

}

// GPS
function startGPS() {
  const onFix = c => { gpsFix = { lat: c.latitude, lng: c.longitude, acc: c.accuracy }; if (!demo) setMe(gpsFix.lat, gpsFix.lng, gpsFix.acc); };
  const onErr = denied => { if (!me) useFallback(denied ? 'Sem permissão de localização.' : 'Não consegui achar sua localização.'); };
  status('<span class="spin"></span><span>Pedindo sua localização…</span>');
  const Geo = window.Capacitor?.isNativePlatform?.() && window.Capacitor.Plugins?.Geolocation;
  if (Geo) { // dentro do app Android
    Geo.requestPermissions().then(r => {
      if (r.location === 'denied') return onErr(true);
      Geo.watchPosition({ enableHighAccuracy: true, maximumAge: 5000, timeout: 20000 }, (pos, err) => { if (pos) onFix(pos.coords); else if (err) onErr(false); });
    }).catch(() => onErr(true));
    return;
  }
  if (!('geolocation' in navigator)) return useFallback('Este navegador não informa a localização.');
  navigator.geolocation.watchPosition(pos => onFix(pos.coords), err => onErr(err.code === 1), { enableHighAccuracy: true, maximumAge: 5000, timeout: 20000 });
}
function useFallback(why) {
  demo = true; renderFabs();
  $('#where').textContent = FALLBACK.nome + ' (exemplo)';
  setMe(FALLBACK.lat, FALLBACK.lng, 0);
  status(`<span>${esc(why)} Mostrando ${FALLBACK.nome}. Toque no mapa para andar.</span><button type="button" data-act="retry-gps">Tentar de novo</button>`);
}

// lugares reais do OpenStreetMap
function categorize(t) {
  const a = t.amenity, s = t.shop, tr = t.tourism, l = t.leisure, h = t.historic;
  if (a === 'cafe' || s === 'coffee') return 'cafe';
  if (a === 'restaurant' || a === 'food_court' || a === 'fast_food' && t.cuisine && !/burger|pizza|sandwich|chicken/.test(t.cuisine) && !t.brand) return 'comida';
  if (a === 'bar' || a === 'pub' || a === 'biergarten' || a === 'nightclub' || s === 'beverages' && /cerve|chope|beer/i.test(t.name || '')) return 'bar';
  if (a === 'ice_cream' || ['bakery', 'confectionery', 'pastry', 'chocolate'].includes(s)) return 'doce';
  if (['park', 'garden', 'nature_reserve'].includes(l) || ['viewpoint', 'zoo', 'theme_park', 'picnic_site'].includes(tr) || ['beach', 'waterfall', 'peak'].includes(t.natural) || t.place === 'square' || t.waterway === 'waterfall') return 'verde';
  if (['cinema', 'theatre', 'library', 'arts_centre', 'community_centre', 'marketplace'].includes(a) || ['books', 'music'].includes(s) || ['museum', 'gallery', 'aquarium', 'artwork', 'attraction'].includes(tr)
    || ['monument', 'memorial', 'castle', 'fort', 'ruins', 'church', 'building', 'manor', 'archaeological_site'].includes(h) || a === 'place_of_worship' && (h || t.heritage || t.wikidata || t.tourism)) return 'cultura';
  if (l === 'stadium' || l === 'sports_centre' && t.wikidata) return 'verde';
  if (['big_wheel', 'roller_coaster', 'amusement_ride'].includes(t.attraction) || ['water_park', 'trampoline_park', 'amusement_arcade'].includes(l)) return 'verde';
  return null;
}
async function loadPlaces() {
  if (fetching || !me) return;
  fetching = true; lastTry = Date.now(); clearTimeout(retryT);
  const c = { lat: me.lat, lng: me.lng };
  const ar = `(around:${RADIUS_FETCH},${c.lat.toFixed(5)},${c.lng.toFixed(5)})`;
  const q = `[out:json][timeout:25];(
    nwr${ar}["amenity"~"^(cafe|bar|pub|biergarten|nightclub|ice_cream|cinema|theatre|library|arts_centre|marketplace|restaurant|food_court|fast_food)$"]["name"];
    nwr${ar}["shop"~"^(bakery|confectionery|pastry|chocolate|coffee|books|music)$"]["name"];
    nwr${ar}["tourism"~"^(museum|gallery|viewpoint|zoo|aquarium|theme_park|attraction|artwork|picnic_site)$"]["name"];
    nwr${ar}["leisure"~"^(park|garden|nature_reserve|stadium)$"]["name"];
    nwr${ar}["natural"~"^(beach|waterfall|peak)$"]["name"];
    nwr${ar}["historic"~"^(monument|memorial|castle|fort|ruins|church|building|manor|archaeological_site)$"]["name"];
    nwr${ar}["amenity"="place_of_worship"]["name"]["historic"];
    nwr${ar}["amenity"="place_of_worship"]["name"]["heritage"];
    nwr${ar}["amenity"="community_centre"]["name"]["wikidata"];
    nwr${ar}["place"="square"]["name"];
    nwr${ar}["attraction"~"^(big_wheel|roller_coaster|amusement_ride)$"]["name"];
    nwr${ar}["leisure"~"^(water_park|trampoline_park)$"]["name"];
  );out center 1500;`;
  if (!places.size) status('<span class="spin"></span><span>Buscando lugares perto de você…</span>');
  const ck = `places4:${c.lat.toFixed(3)},${c.lng.toFixed(3)}`;
  try { for (const k of Object.keys(localStorage)) if (/^places[23]:/.test(k)) localStorage.removeItem(k); } catch (e) {}
  let data = null;
  try { const hit = JSON.parse(localStorage.getItem(ck)); if (hit && Date.now() - hit.t < 864e5) data = hit.d; } catch (e) {}
  if (!data) {
    // pergunta aos servidores em paralelo e fica com o primeiro que responder
    const ctrls = OVERPASS.map(() => new AbortController());
    const ask = (url, i) => fetch(url, { method: 'POST', body: 'data=' + encodeURIComponent(q), headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, signal: ctrls[i].signal })
      .then(r => r.ok ? r.json() : Promise.reject('HTTP ' + r.status));
    let why = '';
    const timer = setTimeout(() => ctrls.forEach(x => x.abort()), 30000);
    try { data = await Promise.any(OVERPASS.map(ask)); } catch (e) { why = [...new Set((e.errors || []).map(x => typeof x === 'string' ? x : x?.name === 'AbortError' ? 'demorou demais' : 'sem conexão'))].join(', '); }
    lastWhy = why;
    clearTimeout(timer); ctrls.forEach(x => x.abort());
    if (data) try { localStorage.setItem(ck, JSON.stringify({ t: Date.now(), d: { elements: data.elements } })); } catch (e) {}
  }
  fetching = false;
  if (!data) {
    fails++;
    if (!places.size || fails > 2) status(`<span title="${esc(lastWhy || 'erro')}">Lugares do mapa fora do ar. Tentando de novo…</span><button type="button" data-act="retry-places">Agora</button>`);
    retryT = setTimeout(loadPlaces, Math.min(120000, 15000 * fails));
    return;
  }
  fails = 0;
  lastFetch = c;
  let n = 0;
  for (const el of data.elements || []) {
    const t = el.tags || {}, cat = categorize(t);
    const lat = el.lat ?? el.center?.lat, lng = el.lon ?? el.center?.lon;
    if (!cat || lat == null || !t.name) continue;
    if (dupOfDest(lat, lng, t.name)) continue;
    const id = el.type[0] + el.id;
    if (!places.has(id)) n++;
    places.set(id, { id, n: t.name, cat, kind: t.amenity || t.shop || t.tourism || t.leisure || t.natural || t.historic || t.place || '', lat, lng, city: t['addr:city'] || t['addr:suburb'] || '',
      addr: [t['addr:street'], t['addr:housenumber']].filter(Boolean).join(', '), hours: t.opening_hours || '' });
  }
  updateWhere();
  if (!places.size) status('<span>Não achei cafés, bares ou parques mapeados aqui.</span><button type="button" data-act="add-place">Cadastrar</button>');
  else if (!demo || !$('#status').innerHTML.includes('retry-gps')) status(null);
  refresh();
}

// ---------- destaques Fuilá (lista curada, atualizada pelo GitHub sem precisar de APK novo) ----------
const DEST_URL = 'https://raw.githubusercontent.com/fassisr/carimbo/main/destaques.json';
const DEST_KEY = 'fuila-destaques-v1';
let destaques = [];
const toks = s => String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').split(/[^a-z0-9]+/).filter(w => w.length > 2);
function dupOfDest(lat, lng, name) {
  const nt = toks(name);
  return destaques.some(d => { const m = meters(d, { lat, lng }); return m < 15 || (m < 120 && nt.some(w => d._t.includes(w))); });
}
function applyDestaques(list) {
  for (const d of destaques) { places.delete(d.id); }
  // só os escolhidos (top) ficam dourados; os outros lugares curados viram paradas comuns
  const anyTop = (list || []).some(d => 'top' in d);
  destaques = (list || []).filter(d => d.id && d.lat != null && CATS[d.cat]).map(d => ({
    id: d.id, n: d.n, cat: d.cat, lat: d.lat, lng: d.lng, dest: anyTop ? !!d.top : true, curado: true, addr: d.end || '', city: d.cidade || '', uf: d.uf || '',
    desc: d.d || '', parceiro: !!d.parceiro, oferta: d.parceiro ? d.oferta || '' : '', logo: d.logo || '', _t: toks(d.n) }));
  for (const [id, p] of places) if (!p.dest && !p.curado && dupOfDest(p.lat, p.lng, p.n)) { places.delete(id); markers.get(id)?.remove(); markers.delete(id); }
  for (const d of destaques) places.set(d.id, d);
  updateWhere(); refresh();
}
async function loadDestaques() {
  try { const c = JSON.parse(localStorage.getItem(DEST_KEY)); if (c?.lugares) applyDestaques(c.lugares); } catch (e) {}
  for (const url of [DEST_URL + '?t=' + Math.floor(Date.now() / 600000), 'destaques.json']) {
    try {
      const r = await fetch(url, { cache: 'no-store' }); if (!r.ok) continue;
      const j = await r.json(); if (!Array.isArray(j.lugares) || !j.lugares.length) continue;
      applyDestaques(j.lugares);
      try { localStorage.setItem(DEST_KEY, JSON.stringify(j)); } catch (e) {}
      return;
    } catch (e) {}
  }
}

let walkRaf = 0;
function walkTo(lat, lng) {
  cancelAnimationFrame(walkRaf);
  if (!me) return setMe(lat, lng, 0);
  const from = { ...me }, d = meters(from, { lat, lng });
  const dur = reduced ? 0 : Math.min(4000, 300 + d * 10);
  const t0 = performance.now(); let lastRefresh = 0;
  const step = now => {
    const t = dur ? Math.min(1, (now - t0) / dur) : 1;
    const la = from.lat + (lat - from.lat) * t, ln = from.lng + (lng - from.lng) * t;
    if (t < 1) {
      const prev = me; me = { lat: la, lng: ln, acc: 0 }; stepAvatar(prev, me);
      meMarker && meMarker.setLngLat([ln, la]); updateRange(); followCam(true);
      if (now - lastRefresh > 150) { lastRefresh = now; refresh(); }
      walkRaf = requestAnimationFrame(step);
    } else setMe(lat, lng, 0);
  };
  walkRaf = requestAnimationFrame(step);
}

function renderNear() {

  const t = e.target.closest('[data-slot]'); if (t) { closetSlot = t.dataset.slot; renderVisual(); t.scrollIntoView?.({ inline: 'nearest', block: 'nearest' }); return; }
  if (e.target.closest('[data-cheer]')) { closetStage?.cheer(); buzz('MEDIUM'); return; }
  const b = e.target.closest('[data-item]'); if (!b) return;
  if (!owns(closetSlot, b.dataset.item)) { toast('Item bloqueado: ganhe abrindo baús'); buzz(); return; }
  setOutfit({ [closetSlot]: b.dataset.item });
  renderVisual();
});

// ---------- conta e nuvem ----------
const cloud = window.fuilaCloud;
let syncing = false, acctStep = null, acctMail = '', acctErr = '';
function partnerPlace(x) {
  return { id: x.id, n: x.n, cat: x.cat, lat: x.lat, lng: x.lng, dest: true, parceiro: true, oferta: x.oferta, logo: x.logo || '',
    addr: x.endereco || '', city: x.cidade || '', uf: x.uf || '', desc: x.d || '', _t: toks(x.n) };
}
let partners = [];
async function loadPartners() {
  try {
    const list = await cloud.partners();
    for (const p of partners) places.delete(p.id);
    partners = list.filter(x => CATS[x.cat]).map(partnerPlace);
    // um parceiro substitui o destaque ou o lugar do mapa que fica no mesmo ponto
    for (const pt of partners) for (const [id, q] of places) if (!q.parceiro && (meters(pt, q) < 15 || (meters(pt, q) < 120 && toks(q.n).some(w => pt._t.includes(w))))) { places.delete(id); markers.get(id)?.remove(); markers.delete(id); }
    for (const pt of partners) places.set(pt.id, pt);
    refresh(); updateWhere(); handlePendingQR();
  } catch (e) {}
}
// traz o progresso da conta e envia o que só existe neste celular
async function cloudSync() {
  if (!cloud.on || syncing || !(await cloud.ready)) return;
  syncing = true;
  try {
    const r = await cloud.pull();
    for (const v of r.visits) if (!st.visits[v.place_id]) st.visits[v.place_id] = { ts: Date.parse(v.ts), p: v.place, synced: 1 }; else st.visits[v.place_id].synced = 1;
    for (const c of r.coupons) {
      const cur = st.coupons.find(x => x.id === c.partner_id);
      const nc = { id: c.partner_id, code: c.code, of: c.oferta, at: Date.parse(c.at), used: c.used_at ? Date.parse(c.used_at) : (cur?.used || 0) };
      st.coupons = st.coupons.filter(x => x.id !== c.partner_id); st.coupons.push(nc);
    }
    // cupons de exemplo das versões antigas não valem mais
    st.coupons = st.coupons.filter(c => r.coupons.some(x => x.partner_id === c.id) || c.code?.startsWith('FUI-'));
    if (r.player?.char?.startsWith('{') && !hasOutfit()) try { setOutfit(JSON.parse(r.player.char), true); } catch (e) {}
    if (r.player) { st.xp = Math.max(st.xp, r.player.xp || 0); for (const [k, t] of Object.entries(r.player.badges || {})) if (!st.badges[k]) st.badges[k] = t; }
    save(); refresh(); renderChrome(); if (tab === 'passaporte') renderPassport(); if (tab === 'cupons') renderCoupons();
    await cloudPush(true);
  } catch (e) {} finally { syncing = false; }
}
async function cloudPush(inSync) {
  if (!cloud.on || (!inSync && syncing) || !(await cloud.ready)) return;
  try {
    const todo = Object.entries(st.visits).filter(([id, v]) => !v.synced && !v.demo && !v.p?.parceiro).map(([id, v]) => ({ id, ...v }));
    await cloud.pushVisits(todo);
    todo.forEach(x => { st.visits[x.id].synced = 1; });
    await cloud.savePlayer({ xp: st.xp, badges: st.badges, char: JSON.stringify(outfit) });
    save();
  } catch (e) {}
}
function acctHTML() {
  if (!cloud.on) return '';
  const head = '<h3>Sua conta</h3>';
  if (!cloud.anon) return `${head}<div class="acct"><b>${esc(cloud.email)}</b><p>Seu passaporte está salvo na nuvem. Entre com este e-mail em outro celular para continuar de onde parou.</p><button type="button" class="ghost" data-acct="out">Sair</button></div>`;
  if (acctStep === 'code') return `${head}<div class="acct"><b>Confira seu e-mail</b><p>Mandamos um código de 6 dígitos para ${esc(acctMail)}.</p>
    <form data-acct="verify"><input name="code" inputmode="numeric" maxlength="8" placeholder="Código" autocomplete="one-time-code" required><button>Confirmar</button></form>
    ${acctErr ? `<div class="err">${esc(acctErr)}</div>` : ''}<p style="margin-top:10px"><button type="button" class="ghost" data-acct="back">Usar outro e-mail</button></p></div>`;
  return `${head}<div class="acct"><b>Salve seu passaporte</b><p>Hoje ele fica neste celular. Com seu e-mail, você não perde nada se trocar de aparelho, e pode entrar numa conta que já tem.</p>
    <form data-acct="send"><input name="email" type="email" placeholder="seu@email.com" autocomplete="email" required value="${esc(acctMail)}"><button>Enviar código</button></form>
    ${acctErr ? `<div class="err">${esc(acctErr)}</div>` : ''}</div>`;
}
$('#v-passaporte').addEventListener('submit', async e => {
  const f = e.target.closest('[data-acct]'); if (!f) return;
  e.preventDefault();
  const btn = f.querySelector('button'); btn.disabled = true; acctErr = '';
  try {
    if (f.dataset.acct === 'send') { acctMail = f.email.value.trim(); await cloud.sendCode(acctMail); acctStep = 'code'; }
    else { const mode = await cloud.verifyCode(acctMail, f.code.value); acctStep = null; toast(mode === 'link' ? 'Passaporte salvo na sua conta' : 'Você entrou na sua conta'); cloudSync(); }
  } catch (err) { acctErr = err.message; }
  renderPassport();
});
$('#v-passaporte').addEventListener('click', async e => {
  const b = e.target.closest('button[data-acct]'); if (!b) return;
  if (b.dataset.acct === 'back') { acctStep = null; acctErr = ''; renderPassport(); }
  if (b.dataset.acct === 'out') { await cloud.signOut(); st = fresh(); save(); refresh(); renderChrome(); renderPassport(); toast('Você saiu da conta'); }
});
// QR lido pela câmera do celular abre o site com ?p=ID&k=CODIGO
let pendingQR = null;
try { const q = new URLSearchParams(location.search); if (q.get('p') && q.get('k')) { pendingQR = { p: q.get('p'), k: q.get('k') }; history.replaceState(null, '', location.pathname); } } catch (e) {}
function handlePendingQR() {
  if (!pendingQR) return;
  const p = places.get(pendingQR.p); if (!p) return;
  openSheet(p.id); show('mapa');
  if (st.visits[p.id]) { pendingQR = null; return; }
  if (!me || dist(p) > reach() + 150) { toast('Chegue até o lugar para usar o QR'); return; }
  const k = pendingQR.k; pendingQR = null;
  cloud.checkinPartner(p.id, k, me.lat, me.lng).then(c => checkin(p, { code: c.code, of: c.oferta, at: Date.parse(c.at) || Date.now(), used: c.used_at ? Date.parse(c.used_at) : 0 })).catch(err => toast(err.message));
}
if (cloud.on) {
  cloud.ready.then(ok => { if (ok) { cloudSync(); loadPartners(); syncMine(); } });
  cloud.onChange(ev => { if (ev === 'SIGNED_IN' || ev === 'USER_UPDATED') cloudSync(); });
}

let toastT = 0;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = true; void t.offsetWidth; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 2400); }


// ---------- apresentação na primeira vez ----------
const INTRO_KEY = 'fuila-intro';
const seenIntro = () => { try { return !!localStorage.getItem(INTRO_KEY); } catch (e) { return true; } };
let introStage = null;
function showIntro() {
  const SL = [
    { me: 1, art: '<div class="in-floor"></div><canvas width="360" height="360"></canvas>', h: 'Esse é você', p: 'No Fuilá você explora a sua cidade de verdade. Depois dá para trocar boné, roupa e tênis do boneco.' },
    { art: ILU.mapa, h: 'Ande até um lugar', p: `Cafés, bares, parques e museus aparecem no mapa. Chegue a ${R} m de um deles e toque em Carimbar.` },
    { art: ILU.carimbo, h: 'Encha o passaporte', p: 'Cada visita vira um carimbo. Complete coleções, ganhe insígnias e veja quanto da cidade você já conhece.' },
    { art: ILU.cupom, h: 'Ganhe descontos', p: 'Os parceiros Fuilá dão um cupom na primeira visita. É só escanear o QR no balcão.' },
  ];
  const o = $('#intro');
  o.innerHTML = `<button type="button" class="in-skip" data-in="skip">Pular</button>
    <div class="in-track">${SL.map((x, i) => `<section class="in-slide${i ? '' : ' on'}"><div class="in-art${x.me ? ' me' : ''}">${x.art}</div><h2>${x.h}</h2><p>${x.p}</p></section>`).join('')}</div>
    <div class="in-foot"><div class="dots">${SL.map((_, i) => `<i${i ? '' : ' class="on"'}></i>`).join('')}</div>
      <button type="button" class="cta" data-in="next">Próximo</button><button type="button" class="in-later" data-in="skip" hidden>Agora não</button></div>`;
  o.hidden = false; window.fuilaPaused = true;
  const tr = o.querySelector('.in-track'), cta = o.querySelector('[data-in="next"]'), later = o.querySelector('.in-later'), last = SL.length - 1;
  let at = 0;
  const go = i => tr.scrollTo({ left: i * tr.clientWidth, behavior: reduced ? 'auto' : 'smooth' });
  tr.addEventListener('scroll', () => {
    const i = Math.round(tr.scrollLeft / tr.clientWidth); if (i === at) return; at = i;
    o.querySelectorAll('.in-slide').forEach((s, k) => s.classList.toggle('on', k === i));
    o.querySelectorAll('.dots i').forEach((d, k) => d.classList.toggle('on', k === i));
    cta.textContent = i === last ? 'Ativar localização e começar' : 'Próximo'; later.hidden = i !== last;
    if (i === 0) introStage?.start(); else introStage?.stop();
  }, { passive: true });
  const done = () => {
    try { localStorage.setItem(INTRO_KEY, '1'); } catch (e) {}
    introStage?.stop(); introStage = null; o.hidden = true; o.innerHTML = ''; window.fuilaPaused = false; window.avatar3d?.resume();
    startGPS();
  };
  o.onclick = e => { const b = e.target.closest('[data-in]'); if (!b) return; buzz(); if (b.dataset.in === 'skip') done(); else if (at < last) go(at + 1); else done(); };
  const boot = () => { const cv = o.querySelector('canvas'); if (!cv || introStage || !window.fuilaBoneco) return; introStage = window.fuilaBoneco.stage(cv); introStage.wear?.(outfit); introStage.ready?.then(() => introStage?.cheer?.()); introStage.start?.(); };
  boot(); window.addEventListener('boneco-ready', boot, { once: true });
}

// app em segundo plano: para de desenhar o boneco no mapa
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { window.fuilaPaused = true; return; }
  if (tab === 'mapa' && $('#intro').hidden) { window.fuilaPaused = false; window.avatar3d?.resume(); }
});
// ---------- início ----------
ensureInv(); applyMine(); renderChrome(); renderFabs(); renderFilters(); renderNear(); show('mapa');
setTimeout(() => { const sp = $('#splash'); sp.classList.add('out'); setTimeout(() => sp.remove(), 450); }, reduced ? 100 : 900);
loadDestaques(); loadFotos();
if (seenIntro()) startGPS(); else setTimeout(showIntro, reduced ? 100 : 900);
})();
</script>
