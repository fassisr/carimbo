<style>
@font-face { font-family: "Bricolage Grotesque"; font-weight: 600; font-display: swap; src: url("assets/fonts/bricolage-grotesque-latin-600-normal.woff2") format("woff2"); }
@font-face { font-family: "Bricolage Grotesque"; font-weight: 800; font-display: swap; src: url("assets/fonts/bricolage-grotesque-latin-800-normal.woff2") format("woff2"); }
@font-face { font-family: "Figtree"; font-weight: 400; font-display: swap; src: url("assets/fonts/figtree-latin-400-normal.woff2") format("woff2"); }
@font-face { font-family: "Figtree"; font-weight: 500; font-display: swap; src: url("assets/fonts/figtree-latin-500-normal.woff2") format("woff2"); }
@font-face { font-family: "Figtree"; font-weight: 600; font-display: swap; src: url("assets/fonts/figtree-latin-600-normal.woff2") format("woff2"); }
@font-face { font-family: "Figtree"; font-weight: 700; font-display: swap; src: url("assets/fonts/figtree-latin-700-normal.woff2") format("woff2"); }
@font-face { font-family: "JetBrains Mono"; font-weight: 500; font-display: swap; src: url("assets/fonts/jetbrains-mono-latin-500-normal.woff2") format("woff2"); }
@font-face { font-family: "JetBrains Mono"; font-weight: 700; font-display: swap; src: url("assets/fonts/jetbrains-mono-latin-700-normal.woff2") format("woff2"); }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
html, body { margin: 0; }

/* Layout: one-screen mobile game; stylized street map edge to edge, bottom tabs, sheets slide over the map */
:root {
  --brand: #3B2BF5; --bg: #F6F5FF; --surface: #FFFFFF; --surface-2: #EFEDFC; --fg: #14112B; --muted: #5D5A78; --line: #DEDBF3;
  --ink: #3B2BF5; --ink-fg: #FFFFFF; --gold: #FFC21A; --gold-fg: #241A00; --ok: #1E8A4C;
  --ground: #B4E6A0; --sky: #CFEFFF; --outside: #D3DECF; --street: #FFFFFF; --casing: #C6D2C2; --avenue: #FFF3D1; --avenue-casing: #E6CF8E;
  --park: #B8D9A6; --tree: #93C27E; --water: #A7CDE4; --label: #6E7D73;
  --me: #3B2BF5; --me-ring: #FFFFFF; --range: rgba(59, 43, 245, .10); --range-line: rgba(59, 43, 245, .55);
  --on-pin: #FFFFFF; --shadow: rgba(20, 35, 25, .22);
  --c-cafe: #A0471D; --c-bar: #6A35B0; --c-doce: #D03A78; --c-verde: #23874A; --c-cultura: #1E62C4;
  --f-display: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --f-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --brand: #2B1FD0; --bg: #0D0B1C; --surface: #17142B; --surface-2: #201C3A; --fg: #EDEBFF; --muted: #9C98BD; --line: #2D2950;
  --ink: #8C80FF; --ink-fg: #0D0B1C; --gold: #FFC93D; --gold-fg: #241A00; --ok: #4CC782;
  --ground: #1D3A4C; --sky: #0F2233; --outside: #121a17; --street: #2B3833; --casing: #0F1613; --avenue: #4A4026; --avenue-casing: #1B170C;
  --park: #1E3727; --tree: #285237; --water: #1A3448; --label: #7E9187;
  --me: #8C80FF; --me-ring: #0D0B1C; --range: rgba(140, 128, 255, .14); --range-line: rgba(140, 128, 255, .6);
  --on-pin: #FFFFFF; --shadow: rgba(0, 0, 0, .5);
  --c-cafe: #D06A39; --c-bar: #9566DB; --c-doce: #EC5E96; --c-verde: #3DAE69; --c-cultura: #4C8BEA;
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --brand: #2B1FD0; --bg: #0D0B1C; --surface: #17142B; --surface-2: #201C3A; --fg: #EDEBFF; --muted: #9C98BD; --line: #2D2950;
  --ink: #8C80FF; --ink-fg: #0D0B1C; --gold: #FFC93D; --gold-fg: #241A00; --ok: #4CC782;
  --ground: #1D3A4C; --sky: #0F2233; --outside: #121a17; --street: #2B3833; --casing: #0F1613; --avenue: #4A4026; --avenue-casing: #1B170C;
  --park: #1E3727; --tree: #285237; --water: #1A3448; --label: #7E9187;
  --me: #8C80FF; --me-ring: #0D0B1C; --range: rgba(140, 128, 255, .14); --range-line: rgba(140, 128, 255, .6);
  --on-pin: #FFFFFF; --shadow: rgba(0, 0, 0, .5);
  --c-cafe: #D06A39; --c-bar: #9566DB; --c-doce: #EC5E96; --c-verde: #3DAE69; --c-cultura: #4C8BEA;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 15px; overflow: hidden; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--me); outline-offset: 2px; }
.ic { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

#app { position: relative; height: 100%; max-width: 520px; margin: 0 auto; display: grid; grid-template-rows: auto 1fr auto; background: var(--bg); overflow: hidden; }
@media (min-width: 560px) { #app { border-left: 1px solid var(--line); border-right: 1px solid var(--line); } }

/* top bar */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--brand); color: #fff; z-index: 5; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand svg { width: 28px; height: 32px; flex: none; }
.brand b { font-family: var(--f-display); font-weight: 800; font-size: 25px; letter-spacing: -.03em; display: block; line-height: 1; }
.brand span { font-size: 12px; color: rgba(255, 255, 255, .72); }
.xp { display: flex; align-items: center; gap: 8px; border: 0; background: rgba(255, 255, 255, .14); color: #fff; border-radius: 999px; padding: 5px 12px 5px 5px; flex: none; }
.xp .lv { background: var(--gold); color: var(--gold-fg); font-weight: 700; font-size: 12px; border-radius: 999px; padding: 3px 8px; }
.xp .pts { font-family: var(--f-mono); font-size: 12px; font-variant-numeric: tabular-nums; }

main { position: relative; min-height: 0; isolation: isolate; z-index: 0; }
.view { position: absolute; inset: 0; }

/* map */
#map { width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none; }
#map.dragging { cursor: grabbing; }
.m-outside { fill: var(--outside); }
.m-ground { fill: var(--ground); }
.m-casing line { stroke: var(--casing); stroke-width: 20; }
.m-street line { stroke: var(--street); stroke-width: 15; }
.m-ave-casing { stroke: var(--avenue-casing); stroke-width: 32; }
.m-ave { stroke: var(--avenue); stroke-width: 26; }
.m-park { fill: var(--park); }
.m-tree { fill: var(--tree); }
.m-water { fill: var(--water); }
.m-label { fill: var(--label); font: 600 10px var(--f-body); letter-spacing: .04em; text-transform: uppercase; }
.m-label.big { font-size: 12px; letter-spacing: .12em; }
.m-park-label { fill: var(--c-verde); font: 700 11px var(--f-body); letter-spacing: .1em; text-transform: uppercase; opacity: .8; }
.pin { cursor: pointer; }
.pin-shadow { fill: var(--shadow); }
.pin-body { stroke: var(--surface); stroke-width: 2.5; }
.pin-glyph { fill: none; stroke: var(--on-pin); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.pin-check-bg { fill: var(--gold); stroke: var(--surface); stroke-width: 2; }
.pin-check { fill: none; stroke: var(--gold-fg); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.pin-pulse { fill: none; stroke: var(--gold); stroke-width: 3; opacity: 0; }
.pin.inrange:not(.visited) .pin-pulse { animation: pulse 1.6s ease-out infinite; }
.pin.visited .pin-body { opacity: .78; }
@keyframes pulse { 0% { r: 14; opacity: .9; } 100% { r: 34; opacity: 0; } }
.me-range { fill: var(--range); stroke: var(--range-line); stroke-width: 1.5; stroke-dasharray: 5 6; }
.me-halo { fill: var(--me); opacity: .25; animation: halo 2.2s ease-out infinite; }
@keyframes halo { 0% { r: 9; opacity: .4; } 100% { r: 26; opacity: 0; } }
.me-dot { fill: var(--me); stroke: var(--me-ring); stroke-width: 3.5; }
.avatar { width: 46px; height: 62px; pointer-events: none; }
.avatar svg { overflow: visible; display: block; filter: drop-shadow(0 2px 2px rgba(20, 17, 43, .25)); }
.av-shadow { fill: rgba(20, 17, 43, .28); }
.av-flip { transition: transform .2s; }
.avatar.left .av-flip { transform: scaleX(-1); }
.av-body { fill: #3B2BF5; stroke: #fff; stroke-width: 1.5; }
.av-pack { fill: #FFC21A; stroke: #fff; stroke-width: 1.5; }
.av-head { fill: #F3C29C; stroke: #fff; stroke-width: 1.5; }
.av-cap { fill: #FFC21A; }
.av-eye { fill: #14112B; }
.av-leg path, .av-arm path { fill: none; stroke: #14112B; stroke-width: 4.5; stroke-linecap: round; }
.av-leg .av-shoe { stroke: #14112B; stroke-width: 4; }
.av-leg-b path, .av-arm-b path { stroke: #3A3560; }
.av-arm path { stroke: #3B2BF5; stroke-width: 4; }
.av-arm-b path { stroke: #2A1FC2; }
.av-leg, .av-arm { transform-box: fill-box; }
.av-leg { transform-origin: 50% 0; } .av-arm { transform-origin: 50% 0; }
.avatar .av-bob { animation: breathe 2.4s ease-in-out infinite; }
.avatar.walking .av-bob { animation: bob .5s ease-in-out infinite; }
.avatar.walking .av-leg-f, .avatar.walking .av-arm-b { animation: swing .5s ease-in-out infinite alternate; }
.avatar.walking .av-leg-b, .avatar.walking .av-arm-f { animation: swing .5s ease-in-out infinite alternate-reverse; }
@keyframes swing { from { transform: rotate(28deg); } to { transform: rotate(-28deg); } }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-2.5px); } }
@keyframes breathe { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-1px); } }

.hint { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--ink-fg); font-size: 13px; font-weight: 600;
  padding: 8px 14px; border-radius: 999px; display: flex; align-items: center; gap: 8px; white-space: nowrap; box-shadow: 0 6px 18px var(--shadow); pointer-events: none; max-width: calc(100% - 32px); }
.hint .ic { width: 16px; height: 16px; }

.near { position: absolute; left: 0; right: 0; bottom: 0; padding-bottom: 12px; }
.near-h { display: flex; justify-content: space-between; align-items: baseline; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); margin-bottom: 8px; }
.near-h b { font-family: var(--f-display); font-weight: 800; font-size: 15px; background: var(--surface); padding: 3px 10px; border-radius: 8px; box-shadow: 0 2px 8px var(--shadow); }
.near-h span { font-size: 12px; color: var(--muted); background: var(--surface); padding: 3px 8px; border-radius: 8px; }
.near-track { display: flex; gap: 10px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 2px 4px; }
.near-track::-webkit-scrollbar { display: none; }
.near-card { scroll-snap-align: start; flex: none; width: 214px; display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; align-items: center; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; box-shadow: 0 6px 16px var(--shadow); }
.nc-ic { grid-row: span 2; width: 38px; height: 38px; border-radius: 50%; background: var(--cc); color: var(--on-pin); display: grid; place-items: center; }
.nc-name { font-weight: 700; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.nc-meta { font-size: 12px; color: var(--muted); display: flex; gap: 6px; align-items: center; font-variant-numeric: tabular-nums; flex-wrap: wrap; }
.star { color: var(--gold); }
.tag { font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 999px; }
.tag.in { background: var(--gold); color: var(--gold-fg); }
.tag.done { background: var(--surface-2); color: var(--ok); border: 1px solid var(--line); }

/* sheet */
.sheet { position: absolute; left: 0; right: 0; bottom: 0; max-height: 78%; overflow-y: auto; background: var(--surface); border-radius: 22px 22px 0 0;
  box-shadow: 0 -10px 30px var(--shadow); padding-block: 8px 20px; padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px));
  animation: up .28s cubic-bezier(.2, .8, .2, 1); z-index: 4; }
@keyframes up { from { transform: translateY(40%); opacity: 0; } to { transform: none; opacity: 1; } }
.sh-grab { width: 40px; height: 4px; border-radius: 4px; background: var(--line); margin: 0 auto 10px; }
.sh-close { position: absolute; top: 12px; right: max(12px, env(safe-area-inset-right, 0px)); width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface-2); display: grid; place-items: center; }
.sh-close .ic { width: 16px; height: 16px; }
.cat-chip { display: inline-flex; align-items: center; gap: 6px; color: var(--cc); font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; }
.cat-chip .ic { width: 16px; height: 16px; }
.sheet h2 { font-family: var(--f-display); font-weight: 800; font-size: 26px; line-height: 1.1; margin: 4px 0 6px; text-wrap: balance; padding-right: 40px; }
.rating { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.rating b { color: var(--fg); }
.stars { display: inline-flex; gap: 1px; }
.stars svg { width: 14px; height: 14px; }
.stars .on { fill: var(--gold); } .stars .off { fill: var(--line); }
.sh-desc { color: var(--muted); line-height: 1.5; margin: 12px 0; max-width: 60ch; }
.offer { position: relative; border: 2px dashed var(--gold); border-radius: 14px; padding: 12px 14px 12px 52px; margin: 12px 0; background: var(--surface-2); }
.offer .ic { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 26px; height: 26px; color: var(--gold); }
.offer small { display: block; font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.offer b { font-size: 16px; }
.offer.used { border-color: var(--line); opacity: .75; }
.prog { display: grid; gap: 6px; margin: 14px 0; font-size: 13px; }
.prog-row { display: flex; justify-content: space-between; gap: 8px; }
.prog-row span { color: var(--muted); font-variant-numeric: tabular-nums; }
.bar { height: 8px; border-radius: 8px; background: var(--surface-2); border: 1px solid var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--cc, var(--gold)); border-radius: 8px; transition: width .4s; }
.cta { width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px; border: 0; border-radius: 14px; padding: 15px; font-weight: 700; font-size: 16px; background: var(--ink); color: var(--ink-fg); }
.cta.gold { background: var(--gold); color: var(--gold-fg); }
.cta[disabled] { background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); cursor: default; }
.linkbtn { display: block; margin: 10px auto 0; background: none; border: 0; color: var(--me); font-weight: 600; font-size: 14px; text-decoration: underline; text-underline-offset: 3px; }
.done-row { display: flex; align-items: center; gap: 14px; background: var(--surface-2); border-radius: 14px; padding: 10px 14px; }
.done-row svg.stamp { width: 64px; height: 64px; flex: none; }
.done-row b { display: block; }
.done-row span { font-size: 13px; color: var(--muted); }

/* list views */
.list { overflow-y: auto; padding-block: 18px 28px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.list h1 { font-family: var(--f-display); font-weight: 800; font-size: 28px; margin: 0 0 4px; letter-spacing: -.01em; }
.list .lede { color: var(--muted); margin: 0 0 18px; line-height: 1.45; max-width: 60ch; }
.list h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); margin: 26px 0 10px; }
.stack { display: grid; gap: 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px; }
.col-top { display: flex; gap: 12px; align-items: center; }
.col-ic { width: 44px; height: 44px; border-radius: 12px; background: var(--cc); color: var(--on-pin); display: grid; place-items: center; flex: none; }
.col-top div { min-width: 0; flex: 1; }
.col-top b { font-family: var(--f-display); font-weight: 800; font-size: 18px; display: block; }
.col-top span { font-size: 13px; color: var(--muted); }
.col-count { font-family: var(--f-mono); font-weight: 700; font-size: 15px; font-variant-numeric: tabular-nums; flex: none !important; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.chip { border: 1px solid var(--line); background: var(--surface-2); border-radius: 999px; padding: 5px 10px; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; }
.chip.on { background: var(--cc); border-color: var(--cc); color: var(--on-pin); font-weight: 600; }
.chip .ic { width: 14px; height: 14px; }
.col-reward { display: flex; align-items: center; gap: 8px; margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--line); font-size: 13px; color: var(--muted); }
.col-reward b { color: var(--fg); }

/* coupons */
.ticket { display: grid; grid-template-columns: 1fr auto; gap: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; position: relative; }
.ticket::before, .ticket::after { content: ""; position: absolute; right: 104px; width: 18px; height: 18px; border-radius: 50%; background: var(--bg); border: 1px solid var(--line); transform: translateX(50%); }
.ticket::before { top: -10px; } .ticket::after { bottom: -10px; }
.t-main { padding: 14px; min-width: 0; }
.t-main small { color: var(--cc); font-weight: 700; font-size: 11px; text-transform: uppercase; letter-spacing: .1em; }
.t-main b { display: block; font-size: 16px; margin: 3px 0 4px; }
.t-main span { font-size: 13px; color: var(--muted); }
.t-side { width: 104px; border-left: 2px dashed var(--line); display: grid; place-items: center; gap: 6px; padding: 10px 8px; text-align: center; }
.code { font-family: var(--f-mono); font-weight: 700; font-size: 13px; letter-spacing: .06em; }
.t-side button { border: 0; background: var(--ink); color: var(--ink-fg); border-radius: 10px; font-size: 12px; font-weight: 700; padding: 7px 8px; }
.ticket.used { opacity: .55; }
.ticket.used .t-side button { background: var(--surface-2); color: var(--muted); }
.empty { text-align: center; padding: 34px 18px; border: 2px dashed var(--line); border-radius: 18px; color: var(--muted); line-height: 1.5; }
.empty .ic { width: 36px; height: 36px; color: var(--line); margin-bottom: 8px; }
.empty b { display: block; color: var(--fg); font-size: 16px; margin-bottom: 4px; }

/* passport */
.pp { background: var(--ink); color: var(--ink-fg); border-radius: 20px; padding: 18px; position: relative; overflow: hidden; }
.pp::after { content: ""; position: absolute; right: -40px; top: -40px; width: 170px; height: 170px; border-radius: 50%; border: 18px solid currentColor; opacity: .06; }
.pp small { font-size: 11px; letter-spacing: .16em; text-transform: uppercase; opacity: .7; }
.pp h2 { font-family: var(--f-display); font-weight: 800; font-size: 28px; margin: 2px 0 12px; }
.pp .bar { background: color-mix(in srgb, var(--ink-fg) 15%, transparent); border: 0; }
.pp .bar i { background: var(--gold); }
.pp-row { display: flex; justify-content: space-between; font-size: 12px; margin-top: 6px; opacity: .8; font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 12px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px; }
.stat b { font-family: var(--f-display); font-size: 24px; font-weight: 800; display: block; font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; color: var(--muted); }
.page { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
  background-image: repeating-linear-gradient(0deg, transparent 0 27px, var(--surface-2) 27px 28px); }
.page svg.stamp { width: 100%; height: auto; display: block; }

// ---------- ficha do lugar ----------
let openId = null;
function openSheet(id) { openId = id; follow = false; $('#sheet').hidden = false; const p = getPlace(id); if (p && places.has(id)) flyTo(p.lat, p.lng); renderSheet(); renderNear(); }
function closeSheet() { openId = null; $('#sheet').hidden = true; renderNear(); follow = true; followCam(); }
const visitsIn = cat => Object.values(st.visits).filter(v => v.p.cat === cat).length;
function renderSheet() {
  const p = getPlace(openId); if (!p) return closeSheet();
  const d = dist(p), v = st.visits[p.id], C = CATS[p.cat];
  const got = Math.min(visitsIn(p.cat), C.meta);
  const isPublic = !C.oferta;
  let action;
  if (v) action = `<div class="done-row">${stampSVG(p, v.ts)}<div><b>Carimbado em ${fmtD(v.ts)}</b><span>${C.oferta ? 'Seu cupom está na aba Cupons.' : 'Este lugar já está no seu passaporte.'}</span></div></div>`;
  else if (d <= reach()) action = `<button class="cta gold" type="button" data-act="scan">${ic('qr')} ${isPublic ? 'Fazer check-in' : 'Escanear QR no balcão'}</button>`;
  else action = `<button class="cta" type="button" disabled>${ic('walk')} Chegue mais perto · faltam ${fmtM(d - reach())}</button>
    <button class="linkbtn" type="button" data-act="walk">Modo demo: ir até lá</button>`;
  $('#sheet').innerHTML = `
    <div class="sh-grab"></div>
    <button class="sh-close" type="button" data-act="close" aria-label="Fechar">${ic('close')}</button>
    <span class="cat-chip" style="--cc:var(--c-${p.cat})">${ic(p.cat)} ${C.nome}</span>
    <h2>${esc(p.n)}</h2>
    <div class="rating"><span>${fmtM(d)} de você</span></div>
    <a class="gbtn" href="${gmapsURL(p)}"${native ? '' : ' target="_blank" rel="noopener"'}>${starsHTML(5)} Ver avaliações no Google</a>
    ${p.addr || p.hours ? `<div class="addr">${esc([p.addr, p.hours && 'Horário: ' + p.hours].filter(Boolean).join(' · '))}</div>` : ''}
    ${C.oferta ? `<div class="offer${v ? ' used' : ''}">${ic('ticket')}<small>${v ? 'Cupom liberado' : 'Na primeira visita · oferta de exemplo'}</small><b>${esc(C.oferta)}</b></div>`
      : `<div class="offer">${ic('verde')}<small>Lugar público</small><b>Vale carimbo e conta para a coleção</b></div>`}
    <div class="prog" style="--cc:var(--c-${p.cat})">
      <div class="prog-row"><b>${C.col}</b><span>${got} de ${C.meta}</span></div>
      <div class="bar"><i style="width:${got / C.meta * 100}%"></i></div>
    </div>
    ${action}`;
}
$('#sheet').addEventListener('click', e => {
  const a = e.target.closest('[data-act]'); if (!a) return;
  const p = getPlace(openId);
  if (a.dataset.act === 'close') closeSheet();
  if (a.dataset.act === 'walk') { demo = true; renderFabs(); const off = 0.00025; walkTo(p.lat - off, p.lng); flyTo(p.lat, p.lng); toast('Modo demo ligado: posição simulada'); }
  if (a.dataset.act === 'scan') openScan(p);
});

// ---------- check-in ----------
let scanTimer = 0;
function openScan(p) {
  const o = $('#scan');
  o.innerHTML = `<div>
    <div class="vf"><svg viewBox="0 0 24 24" fill="none" stroke="#EAF0EC" stroke-width="1.2">${ICONS.qr}</svg><div class="beam"></div></div>
    <div class="scan-txt"><b>Lendo o QR…</b><span>Aponte para o código de ${esc(p.n)}. Neste protótipo a leitura é simulada.</span></div>
    <button class="scan-cancel" type="button" data-act="cancel">Cancelar</button></div>`;
  o.hidden = false;
  o.querySelector('[data-act="cancel"]').onclick = () => { clearTimeout(scanTimer); o.hidden = true; };
  scanTimer = setTimeout(() => { o.hidden = true; checkin(p); }, reduced ? 500 : 1700);
}
function code() { const a = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let s = 'CRB-'; for (let i = 0; i < 4; i++) s += a[Math.floor(Math.random() * a.length)]; return s; }
const nVisits = () => Object.keys(st.visits).length;
const BADGES = [
  { id: 'first', nome: 'Primeiro carimbo', desc: 'Faça o primeiro check-in', icon: 'stamp', cc: 'var(--c-cafe)', xp: 100, ok: () => nVisits() >= 1 },
  { id: 'five', nome: 'Andarilho', desc: 'Carimbe 5 lugares', icon: 'flag', cc: 'var(--c-cultura)', xp: 100, ok: () => nVisits() >= 5 },
  { id: 'ten', nome: 'Explorador', desc: 'Carimbe 10 lugares', icon: 'compass', cc: 'var(--c-bar)', xp: 100, ok: () => nVisits() >= 10 },
  ...CAT_IDS.map(c => ({ id: 'col_' + c, nome: CATS[c].badge, desc: `Carimbe ${CATS[c].meta} lugares de ${CATS[c].nome.toLowerCase()}`, icon: c, cc: `var(--c-${c})`, xp: 150, ok: () => visitsIn(c) >= CATS[c].meta })),
  { id: 'all', nome: 'Dono do pedaço', desc: 'Carimbe 30 lugares', icon: 'crown', cc: 'var(--c-doce)', xp: 200, ok: () => nVisits() >= 30 },
];
function checkin(p) {
  if (st.visits[p.id]) return;
  const now = Date.now();
  st.visits[p.id] = { ts: now, p: { n: p.n, cat: p.cat, lat: p.lat, lng: p.lng, city: p.city || '', addr: p.addr || '' } };
  let gain = XP_VISITA, coupon = null;
  const of = CATS[p.cat].oferta;
  if (of) { coupon = { id: p.id, code: code(), at: now, used: 0, of }; st.coupons.unshift(coupon); }
  const earned = BADGES.filter(b => !st.badges[b.id] && b.ok());
  earned.forEach(b => { st.badges[b.id] = now; gain += b.xp; });
  const lvBefore = level();
  st.xp += gain;
  const up = level() > lvBefore;
  save(); refresh(); renderChrome();
  window.avatar3d?.cheer();
  showReward(p, now, gain, coupon, earned, up);
}
function ticketHTML(c) {
  const p = getPlace(c.id) || { n: 'Lugar', cat: 'cafe' };
  return `<div class="ticket${c.used ? ' used' : ''}" style="--cc:var(--c-${p.cat})">
    <div class="t-main"><small>${esc(p.n)}</small><b>${esc(c.of)}</b><span>${c.used ? `Usado em ${fmtD(c.used)}` : 'Mostre no caixa na próxima visita'}</span></div>
    <div class="t-side"><span class="code">${c.code}</span>${c.used ? '<button type="button" disabled>Usado</button>' : `<button type="button" data-use="${c.id}">Usar agora</button>`}</div>
  </div>`;
}
function showReward(p, ts, gain, coupon, earned, up) {
  const o = $('#reward');
  o.innerHTML = `<div class="rw" role="dialog" aria-label="Lugar carimbado">
    <div class="rw-stamp" style="--rot:0deg">${stampSVG(p, ts)}</div>
    <h2>Carimbado!</h2>
    <p>${esc(p.n)} entrou no seu passaporte.</p>
    <div class="rw-xp">+${gain} XP${up ? ` · Nível ${level() + 1}` : ''}</div>
    ${coupon ? ticketHTML(coupon) : ''}
    ${earned.map(b => `<div class="rw-badge"><div class="medal" style="--cc:${b.cc}">${ic(b.icon)}</div><div><small>Nova insígnia</small><b>${esc(b.nome)}</b></div></div>`).join('')}
    <button class="cta" type="button" data-act="ok">Continuar explorando</button>
  </div>`;
  o.hidden = false;
  o.querySelector('[data-act="ok"]').onclick = () => { o.hidden = true; };
}

// ---------- abas ----------
let tab = 'mapa';
const TABS = { mapa: ['map', 'Mapa'], colecoes: ['grid', 'Coleções'], cupons: ['ticket', 'Cupons'], passaporte: ['passport', 'Passaporte'] };
function renderChrome() {
  $('#xpPill').innerHTML = `<span class="lv">Nv ${level() + 1}</span><span class="pts">${st.xp} XP</span>`;
  const active = st.coupons.filter(c => !c.used).length;
  document.querySelectorAll('.tabs button').forEach(b => {
    const [i, l] = TABS[b.dataset.tab];
    b.innerHTML = `${ic(i)}<span>${l}</span>${b.dataset.tab === 'cupons' && active ? `<span class="dot">${active}</span>` : ''}`;
  });
}
function show(t) {
  tab = t;
  document.querySelectorAll('.tabs button').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === t)));
  for (const k of Object.keys(TABS)) $('#v-' + k).hidden = k !== t;
  if (t === 'mapa' && map) setTimeout(() => map.resize(), 0);
  if (t === 'colecoes') renderCols();
  if (t === 'cupons') renderCoupons();
  if (t === 'passaporte') renderPassport();
}
document.querySelector('.tabs').addEventListener('click', e => { const b = e.target.closest('[data-tab]'); if (b) show(b.dataset.tab); });
$('#xpPill').addEventListener('click', () => show('passaporte'));

function renderCols() {
  $('#v-colecoes').innerHTML = `<h1>Coleções</h1>
    <p class="lede">Carimbe lugares de cada tipo para ganhar uma insígnia rara e +150 XP. As sugestões são os lugares mais perto de você.</p>
    <div class="stack">${CAT_IDS.map(c => {
      const C = CATS[c], done = Object.entries(st.visits).filter(([, v]) => v.p.cat === c);
      const got = Math.min(done.length, C.meta);
      const sug = [...places.values()].filter(p => p.cat === c && !st.visits[p.id]).sort((a, b) => dist(a) - dist(b)).slice(0, Math.max(0, C.meta - done.length + 1));
      return `<div class="card" style="--cc:var(--c-${c})">
        <div class="col-top"><span class="col-ic">${ic(c)}</span><div><b>${C.col}</b><span>${C.nome} · meta de ${C.meta}</span></div><span class="col-count">${got}/${C.meta}</span></div>
        <div class="bar" style="margin-top:12px"><i style="width:${got / C.meta * 100}%"></i></div>
        <div class="chips">${done.map(([id, v]) => `<button type="button" class="chip on" data-goto="${id}">${ic('stamp')}${esc(v.p.n)}</button>`).join('')}${sug.map(p => `<button type="button" class="chip" data-goto="${p.id}">${esc(p.n)} · ${fmtM(dist(p))}</button>`).join('')}</div>
        <div class="col-reward">${ic(got >= C.meta ? 'crown' : 'lock')} Insígnia: <b>${C.badge}</b>${got >= C.meta ? ' · conquistada' : ''}</div>
      </div>`;
    }).join('')}</div>`;
}
$('#v-colecoes').addEventListener('click', e => { const b = e.target.closest('[data-goto]'); if (b) { show('mapa'); openSheet(b.dataset.goto); } });

function renderCoupons() {
  const act = st.coupons.filter(c => !c.used), used = st.coupons.filter(c => c.used);
  $('#v-cupons').innerHTML = `<h1>Cupons</h1>
    <p class="lede">Cada primeira visita libera um desconto. No protótipo as ofertas são de exemplo: os lugares ainda não são parceiros.</p>
    ${st.coupons.length ? `<div class="stack">${act.map(ticketHTML).join('')}</div>
      ${used.length ? `<h3>Já usados</h3><div class="stack">${used.map(ticketHTML).join('')}</div>` : ''}`
    : `<div class="empty">${ic('ticket')}<b>Nenhum cupom ainda</b>Faça check-in num café, bar ou doceria pela primeira vez e o desconto aparece aqui.</div>`}`;
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-use]'); if (!b) return;
  const c = st.coupons.find(x => x.id === b.dataset.use && !x.used); if (!c) return;
  if (b.dataset.armed) { c.used = Date.now(); save(); renderChrome(); if (tab === 'cupons') renderCoupons(); toast(`Cupom ${c.code} usado`); const rw = b.closest('.rw'); if (rw) b.closest('.ticket').outerHTML = ticketHTML(c); }
  else { b.dataset.armed = '1'; b.textContent = 'Confirmar'; }
});

function renderPassport() {
  const lv = level(), into = st.xp - lv * XP_LEVEL, max = lv === TITLES.length - 1;
  const visited = Object.entries(st.visits).sort((a, b) => a[1].ts - b[1].ts);
  const slots = (3 - visited.length % 3) % 3 + 3;
  $('#v-passaporte').innerHTML = `
    <div class="pp">
      <small>Passaporte Fuilá</small>
      <h2>${TITLES[lv]}</h2>
      <div class="bar"><i style="width:${max ? 100 : into / XP_LEVEL * 100}%"></i></div>
      <div class="pp-row"><span>Nível ${lv + 1}</span><span>${max ? `${st.xp} XP` : `${into}/${XP_LEVEL} XP para o nível ${lv + 2}`}</span></div>
    </div>
    <div class="stats">
      <div class="stat"><b>${visited.length}</b><span>Carimbos</span></div>
      <div class="stat"><b>${st.coupons.filter(c => !c.used).length}</b><span>Cupons ativos</span></div>
      <div class="stat"><b>${Object.keys(st.badges).length}/${BADGES.length}</b><span>Insígnias</span></div>
    </div>
    <h3>Carimbos</h3>
    ${visited.length ? `<div class="page">${visited.map(([id, v]) => stampSVG({ id, ...v.p }, v.ts)).join('')}${Array.from({ length: slots }, () => '<div class="slot">?</div>').join('')}</div>`
      : `<div class="empty">${ic('stamp')}<b>Seu passaporte está em branco</b>Chegue a ${R} m de um café, bar, padaria ou parque e faça o check-in para ganhar o primeiro carimbo.</div>`}
    <h3>Seu personagem</h3>
    <div class="chars">${CHARS.map(c => `<button type="button" class="charbtn${curChar() === c.id ? ' on' : ''}" data-char="${c.id}" aria-pressed="${curChar() === c.id}"><img src="assets/chars/${c.id}.png" alt="" width="128" height="128"><span>${c.nome}</span></button>`).join('')}</div>
    <h3>Insígnias</h3>
    <div class="badges">${BADGES.map(b => { const g = st.badges[b.id]; return `<div class="badge${g ? '' : ' locked'}"><div class="medal" style="--cc:${b.cc}">${ic(g ? b.icon : 'lock')}</div><b>${esc(b.nome)}</b><span>${g ? `Conquistada ${fmtD(g)}` : esc(b.desc)}</span></div>`; }).join('')}</div>
    <div class="biz"><b>Sobre os dados:</b> lugares e mapa vêm do OpenStreetMap. As avaliações abrem no Google Maps. As ofertas são de exemplo neste protótipo; na versão de verdade elas vêm de lojas parceiras, que pagam por cada primeira visita confirmada.</div>
    <button class="reset" type="button" id="reset">Recomeçar do zero</button>`;
}
$('#v-passaporte').addEventListener('click', e => {
  const cb = e.target.closest('[data-char]');
  if (cb) {
    try { localStorage.setItem('fuila-char', cb.dataset.char); } catch (err) {}
    window.avatar3d?.setChar(cb.dataset.char);
    renderPassport(); toast(`${CHARS.find(c => c.id === cb.dataset.char).nome} escolhido`);
    return;
  }
  const b = e.target.closest('#reset'); if (!b) return;
  if (!b.classList.contains('armed')) { b.classList.add('armed'); b.textContent = 'Toque de novo para apagar todo o progresso'; return; }
  st = fresh(); save(); refresh(); renderChrome(); renderPassport(); toast('Progresso apagado');
});

let toastT = 0;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 2400); }

// ---------- início ----------
renderChrome(); renderFabs(); show('mapa');
setTimeout(() => { const sp = $('#splash'); sp.classList.add('out'); setTimeout(() => sp.remove(), 450); }, reduced ? 100 : 900);
startGPS();
})();
</script>
</body>
</html>
