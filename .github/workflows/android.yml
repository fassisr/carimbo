name: APK Android

on:
  push:
    branches: [main]
    paths-ignore: [destaques.json, destaques-top.json, destaques-fonte.json, "lugares/**", scripts/**, .github/workflows/destaques.yml, README.md]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Preparar app
        run: |
          npm ci
          npm run build:web
          npx cap sync android

      - name: Gerar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../fuila.apk

      - name: Publicar na release "latest"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Fuilá build ${{ github.run_number }}
          body: |
            APK de teste gerado a partir do commit ${{ github.sha }}.
            Baixe o fuila.apk no celular Android e abra para instalar.
          make_latest: true
          files: fuila.apk
